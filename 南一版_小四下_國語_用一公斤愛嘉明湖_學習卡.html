<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>用一公斤愛嘉明湖 學習卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#f1f5f9;min-height:100vh;-webkit-user-select:none;user-select:none;}
.page{max-width:700px;margin:0 auto;padding:16px 16px 60px;}
.hero{border-radius:0 0 3rem 3rem;margin:-16px -16px 0;padding:28px 20px 80px;text-align:center;background:linear-gradient(135deg,#10b981,#065f46);}
.hero h1{color:white;font-size:1.7rem;font-weight:900;margin-bottom:4px;}
.hero p{color:rgba(255,255,255,0.8);font-size:0.9rem;}
.setup-card{background:white;border-radius:2rem;padding:36px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.15);text-align:center;margin-top:-50px;}
.setup-icon{width:64px;height:64px;border-radius:1.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.6rem;background:#ecfdf5;}
.setup-title{font-size:1.4rem;font-weight:900;color:#1e293b;margin-bottom:6px;}
.setup-sub{color:#64748b;font-size:0.9rem;margin-bottom:24px;}
.setup-sub b{font-weight:800;}
.input-label{font-size:0.7rem;font-weight:700;color:#94a3b8;letter-spacing:0.1em;text-transform:uppercase;display:block;margin-bottom:8px;}
.count-input{width:100%;background:#f1f5f9;border:none;border-radius:1rem;padding:14px;font-size:1.3rem;font-weight:800;text-align:center;outline:none;margin-bottom:16px;color:#1e293b;}
.start-btn{width:100%;background:linear-gradient(135deg,#10b981,#065f46);color:white;border:none;border-radius:1rem;padding:16px;font-size:1.1rem;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.start-btn:active{opacity:0.85;}
.result-card{background:white;border-radius:2rem;padding:40px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.15);text-align:center;margin-top:-50px;}
.result-card .trophy{font-size:3.5rem;margin-bottom:16px;}
.result-card h2{font-size:1.6rem;font-weight:900;color:#1e293b;margin-bottom:8px;}
.result-card p{font-size:1rem;color:#475569;margin-bottom:24px;line-height:1.8;}
.btn-review{display:block;width:100%;background:#ef4444;color:white;border:none;border-radius:1rem;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-bottom:10px;}
.btn-home{display:block;width:100%;background:#e2e8f0;color:#334155;border:none;border-radius:1rem;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;}
.progress-wrap{margin-bottom:14px;}
.progress-row{display:flex;justify-content:space-between;color:white;font-size:0.75rem;font-weight:700;margin-bottom:6px;}
.progress-track{height:7px;background:rgba(255,255,255,0.25);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:white;border-radius:99px;transition:width 0.4s;}
.card-wrap{perspective:1400px;height:520px;margin-bottom:18px;}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 0.55s cubic-bezier(0.23,1,0.32,1);}
.card.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2rem;background:white;box-shadow:0 20px 50px rgba(0,0,0,0.18);overflow:hidden;}
.card-back{transform:rotateY(180deg);background:#fafafa;}
.corner-tag{position:absolute;top:20px;left:24px;font-size:0.85rem;font-weight:800;background:rgba(16,185,129,0.12);color:#065f46;padding:5px 14px;border-radius:10px;z-index:2;}
.back-corner-tag{position:absolute;top:20px;left:24px;font-size:0.85rem;color:#6366f1;font-weight:800;background:rgba(99,102,241,0.1);padding:5px 14px;border-radius:10px;z-index:2;}
.face-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.face-inner::-webkit-scrollbar{display:none;}
.q-text{font-size:1.1rem;font-weight:700;color:#1e293b;margin-bottom:6px;line-height:1.7;text-align:center;white-space:pre-wrap;}
.opts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:12px;}
.opt-btn{font-size:0.95rem;font-weight:600;color:#475569;background:#f8fafc;padding:12px 20px;border-radius:1rem;border:2px solid #e2e8f0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;transition:all 0.15s;}
.opt-btn.selected{background:#ecfdf5;border-color:#10b981;color:#065f46;}
.opt-btn.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#166534!important;}
.opt-btn.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#991b1b!important;}
.answer-box{border:2px solid #10b981;border-radius:1rem;padding:14px 20px;width:100%;text-align:left;font-size:1.05rem;font-weight:700;color:#065f46;background:#ecfdf5;margin-top:14px;display:none;white-space:pre-wrap;line-height:1.8;}
.self-judge{display:none;justify-content:center;gap:12px;margin-top:14px;}
.btn-correct{background:#dcfce7;border:2px solid #22c55e;color:#166534;border-radius:1rem;padding:12px 24px;font-size:1.1rem;font-weight:800;cursor:pointer;}
.btn-wrong-j{background:#fee2e2;border:2px solid #ef4444;color:#991b1b;border-radius:1rem;padding:12px 24px;font-size:1.1rem;font-weight:800;cursor:pointer;}
.explanation{background:#f1f5f9;padding:20px;border-radius:1.2rem;width:100%;font-size:1.05rem;color:#475569;line-height:1.8;border-left:6px solid #10b981;white-space:pre-wrap;overflow-y:auto;max-height:380px;-webkit-overflow-scrolling:touch;margin-top:8px;}
.back-title{font-size:0.75rem;font-weight:700;color:#10b981;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;}
.action-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-bottom:20px;}
.action-btn{background:white;border-radius:1.2rem;padding:14px 10px;box-shadow:0 8px 20px rgba(0,0,0,0.1);min-width:70px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;cursor:pointer;font-size:0.65rem;font-weight:700;color:#64748b;-webkit-tap-highlight-color:transparent;}
.action-btn:disabled{opacity:0.4;cursor:not-allowed;}
.action-btn .icon{font-size:1.3rem;}
.btn-check-style{background:#10b981;color:white;}
.btn-flip-style{background:#6366f1;color:white;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="hero">
  <h1>🏔️ 用一公斤愛嘉明湖 學習卡</h1>
  <p>南一版・小四下國語・課文綜合測驗</p>
</div>
<div class="page">

  <!-- 設定畫面 -->
  <div id="setupSection" class="setup-card">
    <div class="setup-icon">📖</div>
    <div class="setup-title">設定測驗範圍</div>
    <div class="setup-sub">題庫共有 <b>85</b> 題</div>
    <label class="input-label">欲測驗題目數量</label>
    <input type="number" id="countInput" class="count-input" value="10" min="1" max="85">
    <button class="start-btn" id="startBtn">開始測驗</button>
  </div>

  <!-- 結果畫面 -->
  <div id="resultSection" class="result-card hidden">
    <div class="trophy">🏆</div>
    <h2 id="resultTitle">測驗結束！</h2>
    <p id="scoreText"></p>
    <button id="reviewBtn" class="btn-review hidden">重測錯題</button>
    <button id="homeBtn" class="btn-home">返回首頁</button>
  </div>

  <!-- 測驗畫面 -->
  <div id="studySection" class="hidden">
    <div class="progress-wrap">
      <div class="progress-row">
        <span id="modeText">一般模式</span>
        <span id="progressText">0 / 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar" style="width:0%"></div>
      </div>
    </div>

    <div class="card-wrap">
      <div class="card" id="card">
        <!-- 正面 -->
        <div class="card-face">
          <div class="corner-tag" id="frontTag"></div>
          <div class="face-inner">
            <div id="frontMain"></div>
            <div class="opts" id="optsArea"></div>
            <div class="answer-box" id="answerBox"></div>
            <div class="self-judge" id="selfJudge">
              <button class="btn-correct" id="correctBtn">✓ 我答對了</button>
              <button class="btn-wrong-j" id="wrongBtn">✗ 我答錯了</button>
            </div>
          </div>
        </div>
        <!-- 背面 -->
        <div class="card-face card-back">
          <div class="back-corner-tag">詳解</div>
          <div class="face-inner">
            <div class="back-title">解題過程</div>
            <div class="explanation" id="explanation"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button class="action-btn" id="prevBtn"><span class="icon">◄</span>PREV</button>
      <button class="action-btn btn-check-style" id="checkBtn"><span class="icon">📢</span>公布答案</button>
      <button class="action-btn btn-flip-style" id="flipBtn" disabled><span class="icon">📖</span>FLIP詳解</button>
      <button class="action-btn" id="nextBtn"><span class="icon">►</span>NEXT</button>
    </div>
  </div>

</div>

<script>
const DECK=[
  ["改錯字","選擇題","這篇文章十分雋詠，值得人一讀再讀。\n「詠」字錯了，應改成哪個字？","水","永","泳","咏","2","「雋永」意指回味無窮，用「永」字。"],
  ["改錯字","選擇題","有些傷害一旦造成了，就會留下泳久且難以磨滅的傷痕。\n「泳」字錯了，應改成哪個字？","庸","鏞","永","勇","3","「永久」意指長久，用「永」字。"],
  ["改錯字","選擇題","剛跑完操場的大家全都又累又端，坐在地上一動也不想動。\n「端」字錯了，應改成哪個字？","喘","瑞","湍","端","1","「氣喘」用「喘」字，表示呼吸急促。"],
  ["改錯字","選擇題","這部科喚電影講述的是有關時間旅行的故事。\n「喚」字錯了，應改成哪個字？","幼","幻","換","奐","2","「科幻」用「幻」字，表示幻想的。"],
  ["改錯字","選擇題","這隻小狗是格壁鄰居養的，性格非常乖巧。\n「格」字錯了，應改成哪個字？","隔","格","鎘","膈","1","「隔壁」用「隔」字，表示相鄰。"],
  ["改錯字","選擇題","我作墨也沒想到自己居然能獲得科展的優勝。\n「墨」字錯了，應改成哪個字？","莫","漠","夢","默","3","「做夢」用「夢」字。"],
  ["改錯字","選擇題","森林深處有一座美麗的湖伯。\n「伯」字錯了，應改成哪個字？","泊","拍","柏","迫","1","「湖泊」用「泊」字。"],
  ["改錯字","選擇題","這間餐廳的布置有如仙境一般，十分夢幼。\n「幼」字錯了，應改成哪個字？","幼","幻","換","奂","2","「夢幻」用「幻」字，表示如夢境般美麗。"],
  ["改錯字","選擇題","媽媽要求弟弟將床上的衣服斤好並放整齊。\n「斤」字錯了，應改成哪個字？","斤","巾","折","析","3","「折好」用「折」字，表示折疊整齊。"],
  ["改錯字","選擇題","學校的扶河隊終於在全國運動會上拿下了冠軍。\n「扶」字錯了，應改成哪個字？","捕","拔","扶","伏","2","「拔河」用「拔」字。"],
  ["改錯字","選擇題","他因為收到傳幻而需要去警察局接受調查。\n「幻」字錯了，應改成哪個字？","換","幻","喚","奐","3","「傳喚」用「喚」字，表示被呼叫傳喚。"],
  ["改錯字","選擇題","我好像聽見有人在呼渙我。\n「渙」字錯了，應改成哪個字？","渙","奐","換","喚","4","「呼喚」用「喚」字。"],
  ["改錯字","選擇題","聖母峰是許多凳山客都想造訪的世界第一高峰。\n「凳」字錯了，應改成哪個字？","澄","燈","登","鄧","3","「登山」用「登」字。"],
  ["改錯字","選擇題","每次比賽開始前，哥哥都會緊張的在一旁來回沓步。\n「沓」字錯了，應改成哪個字？","沓","搭","踏","蹋","3","「踏步」用「踏」字，表示腳步走動。"],
  ["改錯字","選擇題","讚藍是哥哥最喜歡的顏色。\n「讚」字錯了，應改成哪個字？","站","讚","湛","占","3","「湛藍」用「湛」字，表示深藍色。"],
  ["改錯字","選擇題","曲子已經譜好，接下來只要田好詞，這首歌就完成了。\n「田」字錯了，應改成哪個字？","田","典","填","展","3","「填詞」用「填」字。"],
  ["改錯字","選擇題","忙碌了這麼久，現在終於有時間可以稍微瑞氣一下了。\n「瑞」字錯了，應改成哪個字？","瑞","喘","端","湍","2","「喘氣」用「喘」字，表示呼吸喘息。"],
  ["改錯字","選擇題","在炎熱的天氣下打球，讓我一下子就汗流鋏背了。\n「鋏」字錯了，應改成哪個字？","鋏","夾","頰","浹","4","「汗流浹背」用「浹」字，表示汗水濕透背部。"],
  ["改錯字","選擇題","爺爺每天都會去巡視菜園，並把除雜草、清潔環境。\n「把」字錯了，應改成哪個字？","拔","把","扒","伐","1","「拔除」用「拔」字，表示除去雜草。"],
  ["改錯字","選擇題","小狗那澄徹的雙眼，散發出天真無邪的氣息。\n「澄」字錯了，應改成哪個字？","澄","清","澈","撤","3","「清澈」用「澈」字，表示清晰透明。"],
  ["改錯字","選擇題","姐姐從小就蒙想著能站上國際舞臺演奏音樂。\n「蒙」字錯了，應改成哪個字？","蒙","懵","夢","夜","3","「夢想」用「夢」字。"],
  ["改錯字","選擇題","工程單位正在顛平坑洞，因此這條路要暫時封閉一段時間。\n「顛」字錯了，應改成哪個字？","顛","填","奠","典","2","「填平」用「填」字，表示把坑填滿弄平。"],
  ["改錯字","選擇題","每當百貨公司週年慶時，許多商品都會打拆，可以趁這段時間去採購。\n「拆」字錯了，應改成哪個字？","折","拆","析","哲","1","「打折」用「折」字，表示折扣。"],
  ["改錯字","選擇題","大將軍出面燈高一呼後，全軍的士氣便立刻振作了起來。\n「燈」字錯了，應改成哪個字？","燈","鄧","登","澄","3","「登高一呼」用「登」字。"],
  ["改錯字","選擇題","那名演員的表現精椹，獲得評審們的一致肯定。\n「椹」字錯了，應改成哪個字？","椹","湛","堪","甚","2","「精湛」用「湛」字，表示技術高超。"],
  ["改錯字","選擇題","無論距離相鎘多遠，我們永遠都是彼此的好朋友。\n「鎘」字錯了，應改成哪個字？","隔","鎘","膈","格","1","「相隔」用「隔」字，表示距離分隔。"],
  ["選詞填空","選擇題","下列哪一個選項的句子最通順、合理？","我加強體能，充滿期待的迎向這場做夢幻挑戰","登山客的踩踏和雨水的沖洗刷，使得步道土石流失","這座湖淡泊隱身在海拔三千多公尺的高山上","隨著山路向上爬升高，我漸漸氣喘如牛，腳步也越來越沉重","2","②登山客的踩踏和雨水的沖刷，使得步道土石流失——語意最通順合理。\n①「做夢幻挑戰」用法錯誤；③「淡泊」描述湖不合適；④「爬升高」重複。"],
  ["選詞填空","選擇題","下列選項「　」內的字，哪一個是錯別字？","媽媽大聲呼「喚」著在空地上玩耍的弟弟","山上的河水清「澈」，可以看見魚兒在裡面游著","這次的事件對我而言是一個夢「幻」的經歷","這間房間的「格」音效果很差，走廊上的聲音都聽得一清二楚","4","④「格音」應為「隔音」，「格」是錯別字。"],
  ["注音辨識","選擇題","下列選項「　」中的字，哪一個字的注音是正確的？","汗流「浹」背：轄","山路曲「折」，行走在此是非常辛苦的一件事：則","老鷹在這片「湛」藍的天空中飛翔著：湛","我「凝」望著遠方，看著那美麗的餘暉發呆：玲","3","③湛的讀音正確（ㄓㄢˋ）。\n①浹應讀ㄐㄧㄚ；②折應讀ㄓㄜˊ；④凝應讀ㄋㄧㄥˊ。"],
  ["讀音辨識","選擇題","下列語詞「　」中的字，哪一個讀音與其他三個不同？","論及婚「嫁」","汗流「浹」背","招「架」不住","國定「假」日","2","②浹（ㄐㄧㄚ）讀音與其他三個（都讀ㄐㄧㄚˋ）不同。"],
  ["選詞填空","選擇題","「我每天都騎腳□車去上學。」□中應填入哪個字？","誻","錔","涾","踏","4","「腳踏車」用「踏」字，表示用腳踩踏。"],
  ["注音辨識","選擇題","「老師一大早就忙得汗流『浹』背，十分辛苦。」『浹』寫成國字後，是下列哪一個字？","夾","浹","頰","筴","2","「汗流浹背」的「浹」就是②浹（ㄐㄧㄚ），意思是濕透。"],
  ["量詞辨識","選擇題","「一項」最不適合用來形容下列何者？","活動","石塊","考驗","食材","2","「一項」通常搭配抽象或可數事項，不適合形容具體物品「石塊」。"],
  ["詞性辨識","選擇題","下列「　」中的字，哪一個和「回填」的「填」一樣，都是代表動作的字？","「湛」藍","夢「幻」","踩「踏」","湖「泊」","3","③「踏」是動作字（動詞），和「填」同為動詞。"],

  ["修辭","選擇題","因描寫方式不同，摹寫修辭可分為視覺、聽覺、觸覺、味覺、嗅覺等。下列哪個句子屬於「視覺」摹寫？","我們在金色晨光中，和湛藍的湖水相會","我滿懷期待的迎向這場夢幻的挑戰","走了五個小時，我總算將土石背到指定處","說不定會讓天使感動的落下淚來","1","①「金色晨光」、「湛藍的湖水」均是視覺描寫。②③④均無摹寫修辭。"],
  ["修辭","選擇題","「區區的一公斤，在這段路上格外有分量。」這句話運用了哪兩種修辭法？","映襯、借代","對偶、類疊","借代、對偶","類疊、映襯","4","「區區」是類疊（疊字）；「區區一公斤」對比「格外有分量」是映襯。故選④類疊、映襯。"],
  ["修辭","選擇題","下列何者與「氣喘如牛」運用的修辭法不同？","生不如死","骨瘦如柴","身輕如燕","貌美如花","1","「氣喘如牛」是譬喻（明喻），②③④也都是譬喻。\n①「生不如死」是比較，不是譬喻修辭。"]
];
var card;
var currentDeck=[], wrongDeck=[], currentIndex=0, isAnswered=false, isReview=false;

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  return arr;
}

function startQuiz(){
  var n=parseInt(document.getElementById("countInput").value)||10;
  n=Math.max(1,Math.min(n,DECK.length));
  currentDeck=shuffle(DECK.slice()).slice(0,n);
  wrongDeck=[];
  currentIndex=0;
  isReview=false;
  document.getElementById("modeText").textContent="一般模式";
  document.getElementById("setupSection").classList.add("hidden");
  document.getElementById("resultSection").classList.add("hidden");
  document.getElementById("studySection").classList.remove("hidden");
  showCard();
}

function startReview(){
  if(wrongDeck.length===0) return;
  currentDeck=shuffle(wrongDeck.slice());
  wrongDeck=[];
  currentIndex=0;
  isReview=true;
  document.getElementById("modeText").textContent="錯題重練";
  document.getElementById("resultSection").classList.add("hidden");
  document.getElementById("studySection").classList.remove("hidden");
  showCard();
}

function showCard(){
  isAnswered=false;
  card.classList.remove("flipped");
  var d=currentDeck[currentIndex];
  var total=currentDeck.length;
  document.getElementById("progressText").textContent=(currentIndex+1)+" / "+total;
  document.getElementById("progressBar").style.width=((currentIndex+1)/total*100)+"%";
  document.getElementById("frontTag").textContent=d[0];
  document.getElementById("flipBtn").disabled=true;
  document.getElementById("answerBox").style.display="none";
  document.getElementById("selfJudge").style.display="none";
  var frontMain=document.getElementById("frontMain");
  frontMain.innerHTML="";
  var lines=d[2].split("\n");
  for(var li=0;li<lines.length;li++){
    var lnTxt=lines[li];
    if(lnTxt.trim()===""){continue;}
    var p=document.createElement("p");
    p.className="q-text";
    p.textContent=lnTxt;
    frontMain.appendChild(p);
  }
  var optsArea=document.getElementById("optsArea");
  optsArea.innerHTML="";
  if(d[1]==="選擇題"){
    var nums=["①","②","③","④"];
    for(var oi=0;oi<4;oi++){
      (function(idx){
        var btn=document.createElement("button");
        btn.className="opt-btn";
        btn.textContent=nums[idx]+" "+d[3+idx];
        btn.addEventListener("click",function(){
          if(isAnswered) return;
          var chosen=idx+1;
          var correct=parseInt(d[7]);
          isAnswered=true;
          var btns=optsArea.querySelectorAll(".opt-btn");
          btns.forEach(function(b,bi){
            if(bi+1===correct) b.classList.add("correct");
            else if(bi+1===chosen) b.classList.add("wrong");
          });
          if(chosen!==correct){
            if(wrongDeck.indexOf(d)===-1) wrongDeck.push(d);
          }
          document.getElementById("flipBtn").disabled=false;
          var expl=document.getElementById("explanation");
          expl.textContent=(d[8]||d[7]);
        });
        optsArea.appendChild(btn);
      })(oi);
    }
  } else {
    document.getElementById("flipBtn").disabled=false;
    document.getElementById("selfJudge").style.display="flex";
    var expl=document.getElementById("explanation");
    expl.textContent=(d[8]||d[7]);
  }
}

function checkAnswer(){
  if(isAnswered) return;
  var d=currentDeck[currentIndex];
  if(d[1]==="選擇題"){
    var correct=parseInt(d[7]);
    var btns=document.getElementById("optsArea").querySelectorAll(".opt-btn");
    btns.forEach(function(b,bi){
      if(bi+1===correct) b.classList.add("correct");
    });
    isAnswered=true;
    document.getElementById("flipBtn").disabled=false;
    var expl=document.getElementById("explanation");
    expl.textContent=(d[8]||d[7]);
    if(wrongDeck.indexOf(d)===-1) wrongDeck.push(d);
  } else {
    var ab=document.getElementById("answerBox");
    ab.style.display="block";
    ab.textContent="答案："+d[7];
    document.getElementById("selfJudge").style.display="flex";
    var expl2=document.getElementById("explanation");
    expl2.textContent=(d[8]||d[7]);
    isAnswered=true;
    document.getElementById("flipBtn").disabled=false;
  }
}

function selfJudgeCorrect(){ document.getElementById("selfJudge").style.display="none"; }
function selfJudgeWrong(){
  document.getElementById("selfJudge").style.display="none";
  var d=currentDeck[currentIndex];
  if(wrongDeck.indexOf(d)===-1) wrongDeck.push(d);
}

function flipCard(){ if(isAnswered) card.classList.toggle("flipped"); }

function nextCard(){
  if(currentIndex<currentDeck.length-1){ currentIndex++; showCard(); }
  else showResults();
}

function prevCard(){ if(currentIndex>0){ currentIndex--; showCard(); } }

function showResults(){
  document.getElementById("studySection").classList.add("hidden");
  document.getElementById("resultSection").classList.remove("hidden");
  var t=currentDeck.length, w=wrongDeck.length, c=t-w;
  document.getElementById("scoreText").textContent="答對 "+c+" 題，答錯 "+w+" 題，共 "+t+" 題。";
  var rb=document.getElementById("reviewBtn");
  if(w>0){ rb.classList.remove("hidden"); rb.textContent="重測錯題（"+w+"題）"; }
  else rb.classList.add("hidden");
  var title=document.getElementById("resultTitle");
  var pct=Math.round(c/t*100);
  title.textContent=pct>=90?"太棒了！":pct>=70?"不錯喔！":"繼續加油！";
}

document.addEventListener("DOMContentLoaded",function(){
  card=document.getElementById("card");
  document.getElementById("startBtn").addEventListener("click",startQuiz);
  document.getElementById("checkBtn").addEventListener("click",checkAnswer);
  document.getElementById("flipBtn").addEventListener("click",flipCard);
  document.getElementById("prevBtn").addEventListener("click",prevCard);
  document.getElementById("nextBtn").addEventListener("click",nextCard);
  document.getElementById("correctBtn").addEventListener("click",selfJudgeCorrect);
  document.getElementById("wrongBtn").addEventListener("click",selfJudgeWrong);
  document.getElementById("reviewBtn").addEventListener("click",startReview);
  document.getElementById("homeBtn").addEventListener("click",function(){ location.reload(); });
});
</script>
</body>
</html>
