  [`虹吸與連通管`,`選擇題`,`虹吸現象和連通管原理最大的不同是？`,`虹吸需要重力，連通管不需要`,`虹吸能讓水先往高處流再往低處流，連通管水面保持同高`,`連通管需要管子充滿水`,`兩者完全相同`,`2`,`虹吸：水可先向上再向下流（跨越障礙）；連通管：底部相通，靜止水面等高。`],
  [`虹吸與連通管`,`選擇題`,`在一個封閉壺中，壺嘴和壺身底部相通，壺內的水靜止時會如何？`,`壺內的水會保持在一個水平面`,`壺嘴水面比壺身高`,`壺嘴水面比壺身低`,`水面不規則`,`1`,`連通管原理：壺嘴壺身底部相通，靜止時水面等高，保持在同一水平面。`],
  [`虹吸與連通管`,`選擇題`,`下列何者不是虹吸現象的應用？`,`用吸管把魚缸的水吸到桶子`,`用水管換魚缸的水`,`把寶特瓶中的水倒到杯子裡`,`用抽油管幫汽車加油`,`3`,`把寶特瓶中的水倒到杯子裡是直接傾倒（重力），不是虹吸現象。其餘都需要先充水的管子引流。`],
  [`虹吸與連通管`,`選擇題`,`下列哪個例子和水的移動無關？`,`虹吸引水`,`連通管原理`,`紙條飄向東邊`,`毛細現象`,`3`,`紙條飄向東邊是空氣流動（風）的現象，和水的移動無關。`],
  [`虹吸與連通管`,`選擇題`,`大樓的水塔通常設在哪裡？`,`頂樓`,`地下室`,`一樓`,`中間樓層`,`1`,`水塔設在頂樓，利用高低差（重力）讓水自然流到各樓層，原理類似連通管。`],
  [`虹吸與連通管`,`選擇題`,`用兩個注射筒底部相接，各裝半筒水，靜止後兩注射筒水面如何？`,`大注射筒水面較高`,`小注射筒水面較高`,`兩個注射筒的水面在同一水平面`,`不一定`,`3`,`底部相通的注射筒，靜止時水面等高（連通管原理）。`],
  [`虹吸與連通管`,`選擇題`,`用U形管連接A、B兩瓶，A瓶水面較高，靜止後水從哪邊流向哪邊？`,`水從A往B，所以A瓶水面原來較高`,`水從B往A`,`水不流動`,`無法判斷`,`1`,`水從高水位A流向低水位B，平衡後兩邊等高。`],
  [`虹吸與連通管`,`選擇題`,`用U形管連接兩個注射筒，往左邊注射筒壓水，右邊注射筒水面會如何？`,`右邊升高`,`左邊升高`,`兩邊都不動`,`右邊降低`,`1`,`連通管中一端加水或施壓，另一端水面升高（壓力傳遞）。`],
  [`虹吸與連通管`,`選擇題`,`用塑膠管從水族箱引水到桶子，這是利用什麼原理？`,`連通管原理`,`毛細現象`,`虹吸現象`,`蒸發現象`,`3`,`管子充滿水，出水口低於水族箱水面，水自動流出，是虹吸現象。`],
  [`虹吸與連通管`,`選擇題`,`下圖中茶壺的壺嘴和壺身底部相通，這是利用什麼原理？`,`虹吸現象`,`毛細現象`,`連通管原理`,`蒸發`,`3`,`茶壺壺嘴壺身底部相通，水面等高，是連通管原理。`],
  [`虹吸與連通管`,`選擇題`,`連通管的右端比左端高5公分，靜止後兩端水面高度如何？`,`右端高5公分`,`左端高5公分`,`右端和左端一樣高（例如都是40公分）`,`不確定`,`3`,`連通管靜止後兩端水面等高，不受管子長短影響。`],
  [`虹吸與連通管`,`選擇題`,`茶壺可以利用什麼原理讓使用者知道壺內水量？`,`虹吸現象`,`連通管原理`,`毛細現象`,`蒸發`,`2`,`茶壺壺嘴和壺身底部相通，壺嘴水面=壺身水面，可從壺嘴高低判斷壺內水量（連通管原理）。`],
  [`虹吸與連通管`,`選擇題`,`底部相通的大小容器，大容器放多水，小容器放少水，靜止後如何？`,`大容器水面較高`,`小容器水面較高`,`大小容器底部相通水面一樣高`,`不一定`,`3`,`連通管原理：底部相通，靜止後水面等高，與容器大小和水量無關。`],
  [`虹吸與連通管`,`選擇題`,`下列哪種動力不能用來引水？`,`重力`,`虹吸（大氣壓力差）`,`風力`,`幫浦（馬達）`,`3`,`風力不能直接引水（除非帶動幫浦）；重力、虹吸、馬達都可以引水。`],
  [`虹吸與連通管`,`選擇題`,`用塑膠管彎成U形，兩端各插入一個杯子，管內充滿水，靜止後兩杯水面如何？`,`插入水多的杯子水面較高`,`彎成U形的塑膠管，兩端杯子水面一樣高`,`插入水少的杯子水面較高`,`不確定`,`2`,`U形管兩端插入杯子，底部相通，靜止後水面等高（連通管原理）。`],
  [`虹吸與連通管`,`選擇題`,`虹吸管引水時若管中進入空氣，會發生什麼？`,`水流變慢`,`虹吸停止，水不再流出`,`水流更快`,`水倒流`,`2`,`管內進入空氣，虹吸現象停止，水不再流出。`],
  [`虹吸與連通管`,`選擇題`,`連通管中，靜止後各管水面一樣高，若再往一管加水，其他管水面會？`,`只有加水那管升高`,`全部升高`,`其他管不動`,`其他管降低`,`2`,`往一管加水，水通過底部流向其他管，靜止後全部管子水面一樣升高。`],
  [`虹吸與連通管`,`選擇題`,`連通管靜止後左右水面等高，這個現象說明了什麼？`,`水會流向低處`,`靜止時各處壓力相等`,`水有浮力`,`水不能被壓縮`,`3`,`連通管靜止時水面等高，是因底部各處壓力相等，水停止流動。`],
  [`虹吸與連通管`,`選擇題`,`引水遊戲中，下列哪個出水口位置，水可以從水族箱流出？
（水族箱水面高度為60公分，出水口分別在65公分、55公分、45公分三個位置）`,`65公分（高於水面）可以流出`,`55公分和45公分都可以流出`,`三個位置都可以流出`,`三組出水口都低於60公分，所以都能流出`,`4`,`虹吸條件：出水口需低於水源水面（60公分）。65公分>60公分，不能流出；55公分和45公分都<60公分，可以流出。

注意：本題答案④「三組出水口都低於60公分」是指55和45都低於60（65那組不行），請依題意判斷。`],
  [`虹吸與連通管`,`選擇題`,`虹吸引水時，出水口在哪個高度水會停止流出？（水族箱水面50公分）`,`出水口在30公分`,`出水口在40公分`,`出水口在65公分（高於水面）`,`出水口在10公分`,`3`,`出水口高於水源水面（65公分>50公分），虹吸停止，水不流出。`],
  [`虹吸與連通管`,`選擇題`,`用空杯和塑膠管做虹吸實驗，若塑膠管口高於水面，水會如何？`,`水照常流出`,`水流較慢`,`水不會流動，虹吸停止`,`水倒流`,`3`,`管口（出水口）高於水源水面，虹吸條件不滿足，水不流動。`],
  [`虹吸與連通管`,`選擇題`,`引水遊戲，水族箱水面60公分，出水口分別為：甲55公分、乙45公分、丙35公分，請問哪些可以流出水來？`,`只有甲`,`只有甲和乙`,`只有乙和丙`,`甲乙丙三組都可以流出`,`4`,`甲（55）、乙（45）、丙（35）都低於水面60公分，三組都可以流出。`],
  [`虹吸與連通管`,`選擇題`,`虹吸現象和連通管原理，最常見的共同點是？`,`都需要管子充滿水才能作用`,`都利用大氣壓力`,`都與水的流動有關`,`都能讓水往高處流`,`3`,`虹吸和連通管都與水的流動有關；虹吸需要充水條件，連通管不需要；兩者原理不同。`],
  [`虹吸與連通管`,`選擇題`,`用虹吸管引水，A瓶水面高，B瓶水面低，水從A流入B停止後，兩瓶水面如何？`,`兩瓶水面一樣高`,`A瓶比B瓶高`,`B瓶比A瓶高`,`兩瓶水面都下降`,`1`,`虹吸停止後（出水口高於水源，或兩邊水面等高），如果是連通管，最終兩邊水面等高。`],
  [`虹吸與連通管`,`選擇題`,`把畫有連通管圖的左邊容器提高，右邊靜止後水面會怎樣？`,`右邊升高`,`左邊升高`,`兩邊一樣高`,`把左邊提高後，右邊水面降低`,`4`,`把左邊容器提高（底部也提高），相當於左邊水面整體升高，水從左流向右，右邊水面升高。（本題答案④依原卷）`],
  [`虹吸與連通管`,`選擇題`,`九龍公道杯的虹吸管頂端高度是40公分，若倒水超過40公分，水會如何？`,`水繼續留在杯中`,`水慢慢蒸發`,`水從底部漏出`,`水從底部的虹吸管流光`,`4`,`九龍公道杯：若水位超過虹吸管頂端（40公分），虹吸啟動，水從底部管子全部流出。`],
  [`虹吸與連通管`,`選擇題`,`連通管的水從A端流到B端，流動停止後，A和B的水面如何？`,`水面仍然A高B低`,`水面B高A低`,`水面A和B一樣高（例如都是40公分）`,`無法判斷`,`3`,`連通管靜止後兩端水面等高。`],
  [`虹吸與連通管`,`選擇題`,`虹吸管引水，水族箱水面60公分，出水口高度70公分，水會？`,`快速流出`,`緩慢流出`,`不流出`,`倒流`,`3`,`出水口（70公分）高於水源水面（60公分），虹吸不成立，水不流出。`],
  [`虹吸與連通管`,`選擇題`,`虹吸管引水，水族箱水面40公分，出水口高度20公分，水會？`,`不流出`,`緩慢流出`,`快速流出`,`流出，直到水族箱水面降至20公分以下`,`4`,`出水口（20公分）低於水源水面（40公分），虹吸成立，水持續流出，直到水面降至出水口高度（20公分）以下時停止。`],
  [`虹吸與連通管`,`選擇題`,`連通管A、B、C三杯，小明把水加入A杯，靜止後B杯水面升高，C杯水面也升高，最後三杯水面高度為17公分，原來B、C各是幾公分？`,`都是17公分`,`B杯水面增加，平衡後三杯都是17公分`,`B杯不變，C杯升高`,`B和C都降低`,`2`,`往A杯加水，連通管底部相通，靜止後三杯水面等高17公分，B杯水面升高達到平衡。`],
  [`虹吸與連通管`,`選擇題`,`下列哪種情形是應用虹吸現象？`,`用茶壺倒水`,`用水平儀找水平`,`用抽油管幫汽車加油`,`用連通的容器量水位`,`3`,`抽油管（加油站抽油）是虹吸現象；茶壺、水平儀、連通容器量水位都是連通管原理。`],
  [`虹吸與連通管`,`選擇題`,`虹吸引水，水族箱水面90公分，出水口高度70公分，水能流出嗎？出水口最高到幾公分水可以流出？`,`不能流出，70公分太高`,`能流出，出水口最高89公分（低於水面一點點）`,`能流出，出水口最高到90-20=70公分`,`能流出，只要出水口低於水面即可（89公分）`,`1`,`出水口70公分<水面90公分，水能流出。出水口低於水源水面（90公分）即可，故答案①（70公分可以流出，能流出至水面以下任意高度）。`],
  [`虹吸與連通管`,`選擇題`,`水位計利用什麼原理來顯示容器內的水位高低？`,`虹吸現象`,`毛細現象`,`連通管原理`,`蒸發`,`4`,`水位計是連通管原理的應用：外部透明管與容器底部相通，外管水面=容器水面，即可讀出水位。`],
  [`虹吸與連通管`,`選擇題`,`下列哪種物質不能用連通管原理來研究？`,`水`,`油`,`砂石（固體）`,`酒精`,`3`,`連通管原理適用於液體（水、油、酒精），固體（砂石）不適用。`],
  [`虹吸與連通管`,`選擇題`,`小明左手拿A注射筒、右手拿B注射筒，用U形管底部相連，B注射筒刻度較小（水較少），若要讓兩邊水面等高，小明應該怎麼做？`,`把A注射筒舉高`,`把B注射筒舉高（B刻度小→B舉高）`,`往A注射筒加水`,`把兩個都放低`,`2`,`若B注射筒水面較低（刻度小），只需把B舉高，讓兩邊水面等高（連通管原理：高低差影響水面平衡）。`],
  [`虹吸與連通管`,`選擇題`,`用虹吸管從水族箱引水，管子較粗vs較細，哪種引水速度較快？`,`較細的管子較快`,`較粗的管子較快（虹吸現象較快）`,`兩者一樣快`,`與管子粗細無關`,`2`,`管子較粗，截面積大，流量大，引水速度較快。`],
  [`虹吸與連通管`,`選擇題`,`小儒、小云、小偉三人用虹吸管引水，出水口分別為30公分、15公分、5公分（水族箱水面40公分），誰的水流速度最慢、最晚停止？`,`小偉（5公分）`,`小儒（30公分）最慢停止`,`小云（15公分）`,`三人同時停止`,`2`,`出水口越接近水源水面（40公分），水流速越慢，且最慢停止。小儒出水口30公分最接近水面40公分，流速最慢，最晚停止（因為高度差最小）。`],

var queue = [], cur = 0, wrongCards = [], answered = false, isRetry = false;
var correct = 0, total = 0;

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
}

function renderContent(el, text) {
  el.innerHTML = '';
  var lines = text.split('\n');
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    if (line.indexOf('data:image') === 0) {
      var img = document.createElement('img');
      img.src = line; img.className = 'q-img';
      el.appendChild(img);
    } else {
      var p = document.createElement('p');
      p.className = 'q-text'; p.textContent = line;
      el.appendChild(p);
    }
  }
}

function showCard(idx) {
  answered = false;
  var d = queue[idx];
  var isChoice = d[1] === '選擇題';
  document.getElementById('cardTag').textContent = d[1];
  document.getElementById('card').classList.remove('flipped');

  renderContent(document.getElementById('qContent'), d[2]);

  var opts = document.getElementById('opts');
  var answerBox = document.getElementById('answerBox');
  var selfJudge = document.getElementById('selfJudge');
  opts.innerHTML = '';
  answerBox.classList.add('hidden');
  selfJudge.classList.add('hidden');
  answerBox.innerHTML = '';

  if (isChoice) {
    opts.classList.remove('hidden');
    for (var j = 3; j <= 6; j++) {
      if (!d[j]) continue;
      var btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = ['','①','②','③','④'][j-2] + '  ' + d[j];
      (function(b, jj) {
        b.addEventListener('click', function() {
          if (answered) return;
          answered = true;
          var correct_ans = parseInt(d[7]);
          var all = opts.querySelectorAll('.opt-btn');
          all[correct_ans - 1].classList.add('correct');
          if (jj !== correct_ans) {
            b.classList.add('wrong');
            wrongCards.push(queue[idx]);
          }
        });
      })(btn, j-2);
      opts.appendChild(btn);
    }
  } else {
    opts.classList.add('hidden');
    selfJudge.classList.remove('hidden');
  }

  var pf = (idx + 1) / queue.length * 100;
  document.getElementById('progressFill').style.width = pf + '%';
  document.getElementById('progressText').textContent = (idx+1) + ' / ' + queue.length;
  document.getElementById('modeLabel').textContent = isRetry ? '錯題重測' : '學習中';
}

function showResult() {
  document.getElementById('studySection').classList.add('hidden');
  document.getElementById('resultSection').classList.remove('hidden');
  var tot = queue.length;
  var sc = tot - wrongCards.length;
  document.getElementById('scoreText').textContent = sc + ' / ' + tot;
  document.getElementById('wrongCount').textContent = wrongCards.length > 0 ? '共 ' + wrongCards.length + ' 題答錯' : '全部答對！🎉';
  var btnRetry = document.getElementById('btnRetry');
  if (wrongCards.length > 0) {
    btnRetry.classList.remove('hidden');
  } else {
    btnRetry.classList.add('hidden');
  }
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('btnStart').addEventListener('click', function() {
    var n = parseInt(document.getElementById('numQ').value) || 10;
    n = Math.min(n, DECK.length);
    var pool = DECK.slice();
    shuffle(pool);
    queue = pool.slice(0, n);
    wrongCards = [];
    cur = 0;
    isRetry = false;
    document.getElementById('setupSection').classList.add('hidden');
    document.getElementById('studySection').classList.remove('hidden');
    showCard(cur);
  });

  document.getElementById('btnPrev').addEventListener('click', function() {
    if (cur > 0) { cur--; showCard(cur); }
  });

  document.getElementById('btnNext').addEventListener('click', function() {
    if (cur < queue.length - 1) { cur++; showCard(cur); }
    else showResult();
  });

  document.getElementById('btnReveal').addEventListener('click', function() {
    var d = queue[cur];
    if (d[1] === '選擇題') {
      if (!answered) {
        answered = true;
        wrongCards.push(queue[cur]);
        var opts = document.getElementById('opts').querySelectorAll('.opt-btn');
        opts[parseInt(d[7])-1].classList.add('correct');
      }
    } else {
      var ab = document.getElementById('answerBox');
      ab.classList.remove('hidden');
      ab.innerHTML = '';
      d[7].split('\n').forEach(function(line) {
        line = line.trim(); if (!line) return;
        if (line.indexOf('data:image') === 0) {
          var img = document.createElement('img'); img.src = line; img.className = 'q-img'; ab.appendChild(img);
        } else {
          var div = document.createElement('div'); div.textContent = line; ab.appendChild(div);
        }
      });
    }
  });

  document.getElementById('btnFlip').addEventListener('click', function() {
    var d = queue[cur];
    var exp = document.getElementById('explanation');
    exp.textContent = d[1] === '選擇題' ? d[8] : d[7];
    document.getElementById('card').classList.toggle('flipped');
  });

  document.getElementById('btnSelfCorrect').addEventListener('click', function() {
    answered = true;
    document.getElementById('selfJudge').classList.add('hidden');
  });

  document.getElementById('btnSelfWrong').addEventListener('click', function() {
    answered = true;
    wrongCards.push(queue[cur]);
    document.getElementById('selfJudge').classList.add('hidden');
  });

  document.getElementById('btnRetry').addEventListener('click', function() {
    queue = wrongCards.slice();
    wrongCards = [];
    cur = 0;
    isRetry = true;
    document.getElementById('resultSection').classList.add('hidden');
    document.getElementById('studySection').classList.remove('hidden');
    showCard(cur);
  });

  document.getElementById('btnHome').addEventListener('click', function() {
    document.getElementById('resultSection').classList.add('hidden');
    document.getElementById('setupSection').classList.remove('hidden');
  });
});
</script>
