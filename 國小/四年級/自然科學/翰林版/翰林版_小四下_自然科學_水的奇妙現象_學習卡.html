<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水的奇妙現象 學習卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f9ff;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}

/* ── Header ── */
.header{width:100%;background:linear-gradient(135deg,#0ea5e9,#0284c7);padding:18px 24px 60px;text-align:center;position:relative}
.header h1{color:#fff;font-size:1.6rem;font-weight:900;letter-spacing:.5px}
.header p{color:rgba(255,255,255,.75);font-size:.85rem;margin-top:4px}

/* ── Main card lifts over header ── */
.main-wrap{width:100%;max-width:680px;padding:0 16px 60px;margin-top:-44px}

/* ── Setup screen ── */
.setup-card{background:#fff;border-radius:2rem;padding:32px 28px 28px;box-shadow:0 20px 60px rgba(14,165,233,.15)}
.setup-icon{font-size:2.6rem;text-align:center;margin-bottom:8px}
.setup-card h2{text-align:center;font-size:1.2rem;font-weight:800;color:#0c4a6e;margin-bottom:4px}
.deck-count{text-align:center;color:#64748b;font-size:.88rem;margin-bottom:24px}

.filter-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.filter-btn{padding:7px 18px;border-radius:99px;border:2px solid #e0f2fe;background:#f0f9ff;color:#0ea5e9;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s}
.filter-btn.active{background:#0ea5e9;border-color:#0ea5e9;color:#fff}

.count-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:24px}
.count-label{font-size:.88rem;color:#64748b;font-weight:600}
.count-box{display:flex;align-items:center;gap:8px;background:#f0f9ff;border-radius:1rem;padding:8px 16px}
.count-box input{width:52px;text-align:center;font-size:1.1rem;font-weight:800;color:#0c4a6e;border:none;background:transparent;outline:none}
.count-adj{width:32px;height:32px;border-radius:50%;border:2px solid #bae6fd;background:#fff;color:#0ea5e9;font-size:1.1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.count-adj:hover{background:#0ea5e9;border-color:#0ea5e9;color:#fff}

.start-btn{width:100%;padding:15px;border-radius:1.2rem;border:none;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;font-size:1.05rem;font-weight:800;cursor:pointer;letter-spacing:.5px;box-shadow:0 8px 24px rgba(14,165,233,.35);transition:transform .15s,box-shadow .15s}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(14,165,233,.45)}
.start-btn:active{transform:translateY(0)}

/* ── Progress bar ── */
.progress-wrap{margin-bottom:18px}
.progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-meta span{font-size:.82rem;font-weight:700;color:#64748b}
.progress-meta .p-num{color:#0284c7;font-size:.95rem}
.progress-track{height:8px;background:#e0f2fe;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#0284c7);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ── Flip card ── */
.card-scene{perspective:1400px;height:420px;margin-bottom:18px}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.23,1,.32,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:2rem;display:flex;flex-direction:column;padding:28px 24px 20px}
.card-front{background:#fff;box-shadow:0 16px 48px rgba(14,165,233,.12)}
.card-back{background:linear-gradient(160deg,#f0f9ff,#e0f2fe);box-shadow:0 16px 48px rgba(14,165,233,.12);transform:rotateY(180deg)}

.card-tag{display:inline-block;background:#e0f2fe;color:#0284c7;font-size:.72rem;font-weight:800;padding:4px 12px;border-radius:99px;margin-bottom:14px;align-self:flex-start}
.card-tag.back-tag{background:#bae6fd;color:#0369a1}

.q-num{font-size:.78rem;font-weight:700;color:#94a3b8;margin-bottom:6px}
.q-text{font-size:1.1rem;font-weight:700;color:#0c4a6e;line-height:1.7;white-space:pre-wrap;flex:1;overflow-y:auto}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt-btn{padding:11px 18px;border-radius:1rem;border:2px solid #e0f2fe;background:#f8fbff;color:#0c4a6e;font-size:.92rem;font-weight:600;text-align:left;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}
.opt-btn:hover:not(:disabled){border-color:#7dd3fc;background:#f0f9ff}
.opt-btn .opt-sym{width:26px;height:26px;border-radius:50%;background:#e0f2fe;color:#0284c7;font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt-btn.correct{border-color:#22c55e;background:#f0fdf4;color:#166534}
.opt-btn.correct .opt-sym{background:#22c55e;color:#fff}
.opt-btn.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.opt-btn.wrong .opt-sym{background:#ef4444;color:#fff}
.opt-btn:disabled{cursor:default}

/* fill-in answer box */
.answer-reveal{background:#fff;border:3px solid #0ea5e9;border-radius:1.2rem;padding:16px 20px;text-align:center;margin-top:16px}
.answer-reveal .label{font-size:.78rem;color:#64748b;font-weight:700;margin-bottom:4px}
.answer-reveal .ans{font-size:1.5rem;font-weight:900;color:#0284c7}

/* self-judge */
.self-judge{display:flex;gap:10px;margin-top:auto;padding-top:14px}
.sj-btn{flex:1;padding:11px;border-radius:1rem;border:2px solid;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s}
.sj-correct{border-color:#22c55e;background:#f0fdf4;color:#166534}
.sj-correct:hover{background:#22c55e;color:#fff}
.sj-wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.sj-wrong:hover{background:#ef4444;color:#fff}

/* back content */
.expl-label{font-size:.75rem;font-weight:800;color:#0369a1;letter-spacing:.5px;margin-bottom:8px}
.explanation{font-size:1rem;line-height:1.8;color:#0c4a6e;flex:1;overflow-y:auto;padding-right:4px}
.explanation::-webkit-scrollbar{width:4px}
.explanation::-webkit-scrollbar-thumb{background:#bae6fd;border-radius:2px}

/* ── Action row ── */
.action-row{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.action-btn{flex:1;max-width:140px;background:#fff;border:2px solid #e0f2fe;border-radius:1.2rem;padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(14,165,233,.08)}
.action-btn:hover{border-color:#7dd3fc;box-shadow:0 6px 16px rgba(14,165,233,.18);transform:translateY(-2px)}
.action-btn .icon{font-size:1.2rem}
.action-btn .label{font-size:.65rem;font-weight:800;color:#64748b;letter-spacing:.3px}
.action-btn.reveal-btn{border-color:#22c55e;background:#f0fdf4}
.action-btn.reveal-btn .label{color:#16a34a}
.action-btn.flip-btn{border-color:#a5b4fc;background:#f5f3ff}
.action-btn.flip-btn .label{color:#6366f1}

/* ── Result screen ── */
.result-card{background:#fff;border-radius:2rem;padding:40px 28px 32px;box-shadow:0 20px 60px rgba(14,165,233,.15);text-align:center}
.trophy{font-size:3.5rem;margin-bottom:12px}
.result-card h2{font-size:1.3rem;font-weight:800;color:#0c4a6e;margin-bottom:6px}
.score-big{font-size:3.2rem;font-weight:900;color:#0284c7;line-height:1;margin:12px 0 6px}
.score-sub{font-size:.9rem;color:#64748b;margin-bottom:28px}
.result-btns{display:flex;flex-direction:column;gap:10px}
.result-btn{padding:14px;border-radius:1.2rem;border:none;font-size:.95rem;font-weight:800;cursor:pointer;transition:all .15s}
.result-btn.retry{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;box-shadow:0 6px 18px rgba(244,63,94,.3)}
.result-btn.home{background:#f1f5f9;color:#475569}
.result-btn:hover{transform:translateY(-2px)}

/* ── Error Book ── */
.errorbook-btn{width:100%;padding:13px;border-radius:1.2rem;border:2px solid #fca5a5;background:#fff5f5;color:#ef4444;font-size:.95rem;font-weight:800;cursor:pointer;margin-top:10px;transition:all .15s;min-height:44px}
.errorbook-btn:hover{background:#ef4444;color:#fff}
.eb-count{font-size:.78rem;opacity:.75;margin-left:6px}

/* ── Parent Review ── */
.parent-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.parent-hdr h2{font-size:1.2rem;font-weight:800;color:#0c4a6e}
.parent-close{padding:10px 20px;border-radius:99px;border:2px solid #e0f2fe;background:#fff;color:#64748b;font-size:.85rem;font-weight:700;cursor:pointer;min-height:44px}
.review-item{background:#fff;border-radius:1.5rem;padding:22px 20px 16px;margin-bottom:16px;box-shadow:0 8px 24px rgba(14,165,233,.1)}
.review-q-num{font-size:.75rem;color:#94a3b8;font-weight:700;margin-bottom:6px}
.review-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.review-opt{padding:9px 14px;border-radius:.8rem;font-size:.88rem;display:flex;gap:8px;align-items:center;border:2px solid #e0f2fe}
.review-opt-sym{width:26px;height:26px;border-radius:50%;background:#e0f2fe;color:#0284c7;font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.review-opt.r-correct{border-color:#22c55e;background:#f0fdf4}
.review-opt.r-correct .review-opt-sym{background:#22c55e;color:#fff}
.review-opt.r-wrong{border-color:#ef4444;background:#fef2f2}
.review-opt.r-wrong .review-opt-sym{background:#ef4444;color:#fff}
.review-wb{max-width:100%;border-radius:.8rem;border:1px solid #e0f2fe;margin:10px 0;display:block}
.review-status{font-size:.88rem;font-weight:700;margin-bottom:10px}
.review-status.s-correct{color:#16a34a}
.review-status.s-wrong{color:#dc2626}
.review-status.s-fillin{color:#0284c7}
.review-btns{display:flex;gap:8px;flex-wrap:wrap}
.review-flip-btn{flex:1;min-height:44px;padding:9px;border-radius:1rem;border:2px solid #a5b4fc;background:#f5f3ff;color:#6366f1;font-size:.82rem;font-weight:700;cursor:pointer}
.review-flip-btn:hover{background:#6366f1;color:#fff}
.review-err-btn{flex:1;min-height:44px;padding:9px;border-radius:1rem;border:2px solid #fca5a5;background:#fff5f5;color:#ef4444;font-size:.82rem;font-weight:700;cursor:pointer}
.review-err-btn:hover{background:#ef4444;color:#fff}
.review-err-btn.eb-added{border-color:#22c55e;background:#f0fdf4;color:#16a34a;pointer-events:none}
.review-ans-box{background:#f0f9ff;border-radius:1rem;padding:14px 16px;margin-top:10px}
.review-ans-label{font-size:.75rem;font-weight:800;color:#0369a1;margin-bottom:4px}
.review-ans-text{font-size:1.1rem;font-weight:800;color:#0284c7}
.no-session{text-align:center;padding:40px 20px;color:#94a3b8;font-size:.95rem;line-height:1.8}

/* ── Whiteboard ── */
.wb-wrap{background:#fff;border:2px solid #e0f2fe;border-radius:1.2rem;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 12px rgba(14,165,233,.08)}
#wbCanvas{display:block;width:100%;touch-action:none;cursor:crosshair;background:#fafafa}
.wb-bar{display:flex;justify-content:flex-end;padding:6px 12px;border-top:1px solid #e0f2fe}
.wb-clear{padding:8px 18px;border-radius:99px;border:2px solid #fca5a5;background:#fff5f5;color:#ef4444;font-size:.82rem;font-weight:700;cursor:pointer;min-height:44px}
.wb-clear:hover{background:#ef4444;color:#fff}

.hidden{display:none!important}
</style>
</head>
<body>

<div class="header">
  <h1>💧 水的奇妙現象 學習卡</h1>
  <p>小四自然・虹吸現象與連通管原理</p>
</div>

<div class="main-wrap">

  <!-- Setup -->
  <div id="setupSection">
    <div class="setup-card">
      <div class="setup-icon">🎯</div>
      <h2>準備開始測驗</h2>
      <p class="deck-count">題庫共 <strong id="totalCount">5</strong> 題</p>

      <div class="filter-row" id="filterRow"></div>

      <div class="count-row">
        <span class="count-label">出題數量</span>
        <div class="count-box">
          <button class="count-adj" id="countMinus">−</button>
          <input type="number" id="countInput" value="5" min="1" max="5">
          <button class="count-adj" id="countPlus">＋</button>
        </div>
      </div>

      <button class="start-btn" id="startBtn">開始測驗 →</button>
      <button class="errorbook-btn" id="errorBookBtn">錯題本 <span class="eb-count" id="ebCount"></span></button>
    </div>
  </div>

  <!-- Quiz -->
  <div id="studySection" class="hidden">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="modeLabel">選擇題</span>
        <span class="p-num"><span id="curNum">1</span> / <span id="totNum">5</span></span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="card-scene">
      <div class="card" id="card">
        <!-- Front -->
        <div class="card-face card-front">
          <span class="card-tag" id="frontTag">選擇題</span>
          <div class="q-num" id="qNum">第 1 題</div>
          <div class="q-text" id="frontMain"></div>
          <div class="opts" id="optsWrap"></div>
        </div>
        <!-- Back -->
        <div class="card-face card-back">
          <span class="card-tag back-tag">詳解</span>
          <div class="expl-label">EXPLANATION</div>
          <div class="explanation" id="explanation"></div>
        </div>
      </div>
    </div>

    <div class="wb-wrap" id="wbWrap">
      <canvas id="wbCanvas" height="220"></canvas>
      <div class="wb-bar">
        <button class="wb-clear" id="wbClear">清除白板</button>
      </div>
    </div>

    <div class="action-row">
      <button class="action-btn" id="prevBtn">
        <span class="icon">◀</span>
        <span class="label">上一題</span>
      </button>
      <button class="action-btn" id="nextBtn" style="flex:3;max-width:none">
        <span class="icon">💾</span>
        <span class="label">儲存並下一題</span>
      </button>
    </div>
  </div>

  <!-- Result -->
  <div id="resultSection" class="hidden">
    <div class="result-card">
      <div class="trophy" style="font-size:3.5rem;margin-bottom:12px">✏️</div>
      <h2>練習完成！</h2>
      <p class="score-sub" style="margin-bottom:28px">請把平板交給爸爸媽媽對答案</p>
      <div class="result-btns">
        <button class="result-btn home" id="homeBtn">返回首頁</button>
      </div>
    </div>
  </div>

  <!-- Parent Review -->
  <div id="parentSection" class="hidden">
    <div class="parent-hdr">
      <h2>📋 家長對答模式</h2>
      <button class="parent-close" id="parentClose">關閉</button>
    </div>
    <div id="reviewList"></div>
  </div>

</div>

<script>
const DECK=[
  ["選擇題","選擇題","對於虹吸現象的描述，何者錯誤？","連接容器時使用的塑膠管內必須裝水","連接容器時使用的塑膠管必須充滿空氣","能將水從水位高的容器先向上引出","水會流到水位低的一端","2","虹吸現象中，塑膠管內必須裝水，不是充滿空氣，所以②錯誤。"],
  ["選擇題","選擇題","想利用一條水管將水族箱的水引出來，下列哪一個錯誤？","管內要裝水","管內要充滿空氣","水管的出水口要低於水族箱水面","水管入水口要放進水族箱水面下","2","虹吸現象需要管內裝水，充滿空氣水無法流出，所以②錯誤。"],
  ["選擇題","選擇題","爺爺想運用虹吸現象幫水族箱換水，卻發現水無法流出，可能是什麼原因？","出水口低於水族箱的水面","水族箱的位置較高","塑膠管沒有水","水族箱的尺寸太大","3","虹吸現象需要塑膠管內充滿水，若塑膠管沒有水，水就無法流出。"],
  ["選擇題","選擇題","進行虹吸現象的實驗時，下列哪一項不正確？","塑膠管裡要裝水","出水口要比入水口的水面還要低","出水口要比入水口的水面還要高","塑膠管裡有空氣時，可能會影響結果","3","出水口要比入水口的水面還要低，水才能流出，所以③不正確。"],
  ["選擇題","選擇題","把裝滿水的塑膠管一端放入裝水容器中，另一端放入空容器中，當入水口在水面下且出水口低於水面時，水在水管中是如何流動？","水靜止不動","水先向上流動，後向下流到空容器中","水往回流到裝水容器","水先往下流動，後靜止不動","2","虹吸現象：水先向上引，再向下流到低處的空容器中。"],
  ["選擇題","選擇題","小琪用充滿水的塑膠管為水族箱換水，當水族箱的水面高度和塑膠管的出水口高度相同時，會發生哪一種情形？","水停止流動","水會繼續流動","水的流動速度會變慢","水的流動速度會變快","1","當入水口水面高度和出水口高度相同時，虹吸現象的高度差消失，水停止流動。"],
  ["選擇題","選擇題","下列哪項物品的使用，不是運用連通管原理？","茶壺相通的壺身和壺嘴","海綿吸水","用裝水的塑膠管來測物體的水平","熱水瓶的水位視窗","2","海綿吸水是毛細現象，不是連通管原理。"],
  ["選擇題","選擇題","利用一條充滿水的塑膠管連接甲、乙兩瓶水，發現水正往甲瓶移動，開始時哪一瓶水的水位較高？","甲瓶","乙瓶","兩瓶一樣高","無法判斷","2","水會從水位高的容器往水位低的容器流動，水往甲瓶移動，代表乙瓶水位較高。"],
  ["選擇題","選擇題","把寶特瓶裝七分滿的水蓋上瓶蓋，將瓶蓋端用物品墊高，下列哪一項是錯誤的？","靠近瓶蓋的水會往瓶底端流動","瓶底端的水會往墊高的瓶蓋端流動","水不會一直流動，最後水會靜止","當水靜止時，水面仍是保持一個平面","2","水由高往低流，瓶蓋端墊高後是高處，水從瓶蓋端往瓶底端流動，所以②錯誤。"],
  ["選擇題","選擇題","有一個底座連通的容器，有三根圓柱管（粗細分別像50元、10元、5元硬幣），倒水後水靜止時，水面高度是什麼情形？","粗細像50元硬幣大的圓柱管水面最高","粗細像10元硬幣大的圓柱管水面最高","粗細像5元硬幣大的圓柱管水面最高","三根圓柱管的水面高度一樣高","4","連通管原理：底座相連的容器水面高度都相同，不論管子粗細。"],
  ["選擇題","選擇題","大樓如果要不透過其他機器把水送到每一戶，水塔通常會裝在哪裡？","大樓頂樓","大樓地下停車場","大樓一樓的庭院","大樓二樓的公用廁所","1","水是從高處往低處流，水塔裝在高處才能讓水流到各個樓層。"],
  ["選擇題","選擇題","自製連通管實驗時，將塑膠管連接兩個大小一樣的注射筒，水靜止後，下列敘述何者正確？","把右邊注射筒提高，右邊的水面會維持比左邊水面高","把右邊注射筒提高，水面對齊的刻度位置不會改變","兩個注射筒的水面會在同一個水平面","左邊水位比較高","3","因連通管原理，最後兩邊水位會在同一個水平面。"],

  ["勾選題","填填看","下列哪些是水塔裝置在建築物頂樓的原因？\n(1)水會從高處往下流，水塔的水可以透過水管輸送到各樓層\n(2)為了美觀\n(3)連接水管後，再接到各樓層水龍頭，可以利用連通管原理使用戶打開水龍頭就有水可用","","","","","(1)(3)","水塔裝在頂樓的原因：水由高往低流，加上連通管原理，可以讓水自動流到各樓層。美觀不是主要原因。"],

  ["勾選題","填填看","有關虹吸現象，下列哪些敘述正確？\n(1)塑膠管要裝水\n(2)水會由水管先向上引，再向下流出\n(3)塑膠管要裝滿空氣\n(4)塑膠管出水口要高於入水口容器的水面\n(5)塑膠管出水口要低於入水口容器的水面","","","","","(1)(2)(5)","虹吸現象的條件：塑膠管要裝水（不是空氣）、水會先向上引再向下流出、出水口要低於入水口的水面。"],
  ["勾選題","填填看","小若想利用一條水管把水族箱裡的髒水換掉，她應該怎麼做？\n(1)水管裡要裝水\n(2)水管裡要裝滿空氣\n(3)水管的兩端都要放進水族箱裡\n(4)出水口的位置比水族箱水面低\n(5)出水口的位置比水族箱水面高","","","","","(1)(4)","虹吸現象的必要條件：(1)水管裡裝水；(4)出水口位置比水族箱水面低。"],
  ["勾選題","填填看","下列哪些敘述是正確的？\n(1)我們可以利用虹吸現象幫水族箱換水\n(2)我們可以利用磁鐵的磁力幫水族箱換水\n(3)用裝滿水的塑膠管幫水族箱換水，是虹吸現象的應用\n(4)塑膠管出水口的位置高低會影響水是否能順利引出","","","","","(1)(3)(4)","(2)磁力無法引水；(1)(3)(4)都是關於虹吸現象的正確描述。"],
  ["勾選題","填填看","下列哪些情況的水會呈水平面？\n(1)放置在桌上的水杯裡面的水\n(2)正在落下的雨滴\n(3)水壺裡面的水\n(4)正在倒水時，杯子內的水面\n(5)寶特瓶內的水","","","","","(1)(3)(5)","(2)雨滴是球形；(4)正在倒水時水面有波動；(1)(3)(5)靜止的水面呈水平面。"],
  ["勾選題","填填看","下列哪些是連通管原理的應用？\n(1)自來水供應系統\n(2)游泳圈\n(3)茶壺\n(4)救生衣\n(5)熱水瓶的水位顯示","","","","","(1)(3)(5)","連通管原理的應用：自來水供應系統、茶壺、熱水瓶的水位顯示；游泳圈和救生衣是浮力的應用。"],

var activeFilters=[];var CATS=[];
(function(){var seen={};for(var i=0;i<DECK.length;i++){var c=DECK[i][0];if(!seen[c]){seen[c]=1;CATS.push(c);}}})();
function getFilteredDeck(){
  if(errorBookMode)return errorBookData.slice();
  if(activeFilters.length===0)return DECK.slice();
  return DECK.filter(function(d){return activeFilters.indexOf(d[0])>=0;});
}
function updateSetup(){
  var fd=getFilteredDeck();
  document.getElementById('totalCount').textContent=fd.length;
  var inp=document.getElementById('countInput');
  inp.max=fd.length;
  if(parseInt(inp.value)>fd.length)inp.value=fd.length;
}

var quiz=[],idx=0,revealed=false;
var card;
var sessionAnswers=[];
var currentChoice='';
var errorBookMode=false;
var errorBookData=[];

function startQuiz(){
  var fd=getFilteredDeck();
  var n=Math.min(parseInt(document.getElementById('countInput').value)||5,fd.length);
  var tmp=fd.slice();
  for(var i=tmp.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=tmp[i];tmp[i]=tmp[j];tmp[j]=t;}
  quiz=tmp.slice(0,n);idx=0;sessionAnswers=new Array(n);
  document.getElementById('totNum').textContent=n;
  document.getElementById('setupSection').classList.add('hidden');
  document.getElementById('studySection').classList.remove('hidden');
  showCard();
}

function showCard(){
  wbClearCanvas();
  currentChoice='';
  var d=quiz[idx];
  revealed=false;
  if(card.classList.contains('flipped'))card.classList.remove('flipped');

  document.getElementById('frontTag').textContent=d[0];
  document.getElementById('qNum').textContent='第 '+(idx+1)+' 題';
  document.getElementById('curNum').textContent=idx+1;
  document.getElementById('modeLabel').textContent=d[1];
  document.getElementById('progressFill').style.width=((idx)/quiz.length*100)+'%';

  renderContent(document.getElementById('frontMain'),d[2]);
  renderContent(document.getElementById('explanation'),d[8]||d[7]);

  var opts=document.getElementById('optsWrap');
  opts.innerHTML='';

  if(d[1]==='選擇題'){
    opts.classList.remove('hidden');
    ['①','②','③','④'].forEach(function(sym,i){
      if(!d[3+i])return;
      var btn=document.createElement('button');
      btn.className='opt-btn';
      var sp=document.createElement('span');sp.className='opt-sym';sp.textContent=sym;
      btn.appendChild(sp);
      var tx=document.createElement('span');tx.textContent=d[3+i];
      btn.appendChild(tx);
      btn.addEventListener('click',(function(ans,b){
        return function(){checkAnswer(ans,b);};
      })(String(i+1),btn));
      opts.appendChild(btn);
    });
  } else {
    opts.classList.add('hidden');
  }
}

function checkAnswer(chosen,btn){
  if(revealed)return;
  revealed=true;
  currentChoice=chosen;
  var all=document.querySelectorAll('.opt-btn');
  all.forEach(function(b){b.disabled=true;});
  btn.style.borderColor='#0ea5e9';
  btn.style.background='#e0f2ff';
  btn.querySelector('.opt-sym').style.background='#0ea5e9';
  btn.querySelector('.opt-sym').style.color='#fff';
}

function saveCurrentCard(){
  var d=quiz[idx];
  var isFillin=d[1]!=='選擇題';
  sessionAnswers[idx]={
    chosen:currentChoice,
    correct:d[7],
    isCorrect:isFillin?null:(currentChoice!==''&&currentChoice===d[7]),
    wb:wbDataUrl()
  };
}

function nextCard(){
  saveCurrentCard();
  if(idx<quiz.length-1){idx++;showCard();}
  else showResult();
}
function prevCard(){if(idx>0){idx--;showCard();}}

function showResult(){
  errorBookMode=false;
  saveCurrentCard();
  localStorage.setItem('fc_session',JSON.stringify({
    timestamp:Date.now(),
    cards:quiz,
    answers:sessionAnswers
  }));
  document.getElementById('studySection').classList.add('hidden');
  document.getElementById('resultSection').classList.remove('hidden');
}

function hideAllSections(){
  ['setupSection','studySection','resultSection','parentSection'].forEach(function(id){
    var el=document.getElementById(id);if(el)el.classList.add('hidden');
  });
}

function renderContent(el,text){
  el.innerHTML='';
  if(!text){return;}
  var lines=text.split(/\\n|\n/),i=0;
  while(i<lines.length){
    var ln=lines[i].trim();
    if(!ln){i++;continue;}
    if(ln.startsWith('data:image')){
      var row=document.createElement('div');row.style.textAlign='center';
      while(i<lines.length&&lines[i].trim().startsWith('data:image')){
        (function(src){
          var img=document.createElement('img');img.src=src;
          img.style.maxWidth='100%';img.style.borderRadius='8px';
          img.onload=function(){if(this.naturalWidth>100){this.style.display='block';this.style.margin='8px auto';}};
          row.appendChild(img);
        })(lines[i].trim());i++;
      }
      el.appendChild(row);
    } else {
      var p=document.createElement('p');p.className='q-text';p.textContent=ln;el.appendChild(p);i++;
    }
  }
}

var titleClickCount=0,titleClickTimer=null;

function initTitleClick(){
  var h1=document.querySelector('.header h1');
  h1.addEventListener('click',function(){
    titleClickCount++;
    if(titleClickTimer)clearTimeout(titleClickTimer);
    if(titleClickCount>=5){titleClickCount=0;openParentReview();}
    else titleClickTimer=setTimeout(function(){titleClickCount=0;},2000);
  });
}

function openParentReview(){
  var raw=localStorage.getItem('fc_session');
  if(!raw){
    document.getElementById('reviewList').innerHTML='<div class="no-session">尚無練習記錄<br>請讓孩子先完成一次練習</div>';
  } else {
    buildReviewList(JSON.parse(raw));
  }
  hideAllSections();
  document.getElementById('parentSection').classList.remove('hidden');
}

function buildReviewList(session){
  var list=document.getElementById('reviewList');
  list.innerHTML='';
  var cards=session.cards||[];
  var answers=session.answers||[];
  cards.forEach(function(d,i){
    var ans=answers[i]||{};
    var isFillin=d[1]!=='選擇題';
    var item=document.createElement('div');
    item.className='review-item';
    var qnum=document.createElement('div');
    qnum.className='review-q-num';
    qnum.textContent='第 '+(i+1)+' 題';
    item.appendChild(qnum);
    var qBox=document.createElement('div');
    qBox.className='q-text';
    qBox.style.marginBottom='12px';
    renderContent(qBox,d[2]);
    item.appendChild(qBox);
    if(!isFillin){
      var optsDiv=document.createElement('div');
      optsDiv.className='review-opts';
      ['①','②','③','④'].forEach(function(sym,j){
        if(!d[3+j])return;
        var optDiv=document.createElement('div');
        optDiv.className='review-opt';
        var symSpan=document.createElement('span');
        symSpan.className='review-opt-sym';
        symSpan.textContent=sym;
        var txtSpan=document.createElement('span');
        txtSpan.textContent=d[3+j];
        optDiv.appendChild(symSpan);optDiv.appendChild(txtSpan);
        if(String(j+1)===d[7])optDiv.classList.add('r-correct');
        else if(String(j+1)===ans.chosen)optDiv.classList.add('r-wrong');
        optsDiv.appendChild(optDiv);
      });
      item.appendChild(optsDiv);
    }
    if(ans.wb&&ans.wb.length>100){
      var img=document.createElement('img');
      img.src=ans.wb;img.className='review-wb';
      item.appendChild(img);
    }
    var status=document.createElement('div');
    status.className='review-status';
    if(isFillin){
      status.classList.add('s-fillin');
      status.textContent='填充題 — 請對照白板與答案';
    } else if(ans.isCorrect===true){
      status.classList.add('s-correct');
      status.textContent='✓ 答對了';
    } else if(ans.isCorrect===false){
      status.classList.add('s-wrong');
      status.textContent='✗ 答錯了';
    } else {
      status.textContent='未作答';
    }
    item.appendChild(status);
    var ansBox=document.createElement('div');
    ansBox.className='review-ans-box hidden';
    var ansLabel=document.createElement('div');
    ansLabel.className='review-ans-label';
    ansLabel.textContent='正確答案';
    var ansText=document.createElement('div');
    ansText.className='review-ans-text';
    if(isFillin){
      ansText.textContent=d[7];
    } else {
      var ci=parseInt(d[7])-1;
      ansText.textContent=['①','②','③','④'][ci]+' '+d[3+ci];
    }
    ansBox.appendChild(ansLabel);ansBox.appendChild(ansText);
    var btns=document.createElement('div');btns.className='review-btns';
    var flipBtn=document.createElement('button');
    flipBtn.className='review-flip-btn';
    flipBtn.textContent='翻牌看答案';
    (function(ab,fb){
      fb.addEventListener('click',function(){
        ab.classList.toggle('hidden');
        fb.textContent=ab.classList.contains('hidden')?'翻牌看答案':'收起答案';
      });
    })(ansBox,flipBtn);
    var errBtn=document.createElement('button');
    errBtn.className='review-err-btn';
    errBtn.textContent='加入錯題本';
    (function(deckRow,eb){
      eb.addEventListener('click',function(){
        addToErrorBook(deckRow);
        eb.textContent='已加入 ✓';
        eb.classList.add('eb-added');
      });
    })(d,errBtn);
    btns.appendChild(flipBtn);btns.appendChild(errBtn);
    item.appendChild(btns);
    item.appendChild(ansBox);
    list.appendChild(item);
  });
}

function addToErrorBook(deckRow){
  var raw=localStorage.getItem('fc_errorbook');
  var eb=raw?JSON.parse(raw):[];
  var exists=eb.some(function(r){return r[2]===deckRow[2];});
  if(!exists)eb.push(deckRow);
  localStorage.setItem('fc_errorbook',JSON.stringify(eb));
  updateEbCount();
}

function updateEbCount(){
  var raw=localStorage.getItem('fc_errorbook');
  var eb=raw?JSON.parse(raw):[];
  var span=document.getElementById('ebCount');
  if(span)span.textContent=eb.length?'('+eb.length+' 題)':'';
}

function openErrorBook(){
  var raw=localStorage.getItem('fc_errorbook');
  var eb=raw?JSON.parse(raw):[];
  if(eb.length===0){alert('錯題本是空的\n請先讓家長標記錯題');return;}
  errorBookData=eb.slice();
  errorBookMode=true;
  updateSetup();
}

var wbCtx=null,wbPainting=false;

function wbInit(){
  var canvas=document.getElementById('wbCanvas');
  canvas.width=canvas.parentElement.clientWidth||360;
  wbCtx=canvas.getContext('2d');
  wbCtx.strokeStyle='#1e293b';wbCtx.lineWidth=2.5;wbCtx.lineCap='round';wbCtx.lineJoin='round';
  function pos(e){
    var r=canvas.getBoundingClientRect();
    var src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-r.left)*(canvas.width/r.width),y:(src.clientY-r.top)*(canvas.height/r.height)};
  }
  function down(e){e.preventDefault();wbPainting=true;var p=pos(e);wbCtx.beginPath();wbCtx.moveTo(p.x,p.y);}
  function move(e){e.preventDefault();if(!wbPainting)return;var p=pos(e);wbCtx.lineTo(p.x,p.y);wbCtx.stroke();}
  function up(){wbPainting=false;}
  canvas.addEventListener('mousedown',down);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',up);
  canvas.addEventListener('mouseleave',up);
  canvas.addEventListener('touchstart',down,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',up);
  document.getElementById('wbClear').addEventListener('click',wbClearCanvas);
}

function wbClearCanvas(){
  if(!wbCtx)return;
  var c=document.getElementById('wbCanvas');
  wbCtx.clearRect(0,0,c.width,c.height);
}

function wbDataUrl(){
  if(!wbCtx)return'';
  return document.getElementById('wbCanvas').toDataURL('image/png');
}

document.addEventListener('DOMContentLoaded',function(){
  card=document.getElementById('card');

  var fr=document.getElementById('filterRow');
  CATS.forEach(function(cat){
    var btn=document.createElement('button');
    btn.className='filter-btn';btn.textContent=cat;
    btn.addEventListener('click',function(){
      this.classList.toggle('active');
      if(this.classList.contains('active')){if(activeFilters.indexOf(cat)<0)activeFilters.push(cat);}
      else{activeFilters=activeFilters.filter(function(c){return c!==cat;});}
      updateSetup();
    });
    fr.appendChild(btn);
  });
  updateSetup();

  document.getElementById('startBtn').addEventListener('click',startQuiz);
  document.getElementById('prevBtn').addEventListener('click',prevCard);
  document.getElementById('nextBtn').addEventListener('click',nextCard);
  document.getElementById('homeBtn').addEventListener('click',function(){
    errorBookMode=false;
    document.getElementById('resultSection').classList.add('hidden');
    document.getElementById('setupSection').classList.remove('hidden');
    updateSetup();
    updateEbCount();
  });
  document.getElementById('countMinus').addEventListener('click',function(){
    var inp=document.getElementById('countInput');
    if(parseInt(inp.value)>1)inp.value=parseInt(inp.value)-1;
  });
  document.getElementById('countPlus').addEventListener('click',function(){
    var inp=document.getElementById('countInput');
    if(parseInt(inp.value)<parseInt(inp.max))inp.value=parseInt(inp.value)+1;
  });
  document.getElementById('errorBookBtn').addEventListener('click',openErrorBook);
  updateEbCount();
  wbInit();
  initTitleClick();
  document.getElementById('parentClose').addEventListener('click',function(){
    hideAllSections();
    document.getElementById('setupSection').classList.remove('hidden');
  });
});
</script>
