<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>國語 學習卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#f1f5f9;min-height:100vh;-webkit-user-select:none;user-select:none;}
.page{max-width:700px;margin:0 auto;padding:16px 16px 60px;}

/* 頂部 */
.hero{background:linear-gradient(135deg,#e11d48,#9f1239);border-radius:0 0 3rem 3rem;margin:-16px -16px 0;padding:28px 20px 80px;text-align:center;}
.hero h1{color:white;font-size:1.7rem;font-weight:900;margin-bottom:4px;}
.hero p{color:rgba(255,255,255,0.8);font-size:0.9rem;}

/* 設定卡 */
.setup-card{background:white;border-radius:2rem;padding:36px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.15);text-align:center;margin-top:-50px;}
.setup-icon{width:64px;height:64px;background:#fff1f2;border-radius:1.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.6rem;}
.setup-title{font-size:1.4rem;font-weight:900;color:#1e293b;margin-bottom:6px;}
.setup-sub{color:#64748b;font-size:0.9rem;margin-bottom:24px;}
.setup-sub b{color:#e11d48;}
.input-label{font-size:0.7rem;font-weight:700;color:#94a3b8;letter-spacing:0.1em;text-transform:uppercase;display:block;margin-bottom:8px;}
.count-input{width:100%;background:#f1f5f9;border:none;border-radius:1rem;padding:14px;font-size:1.3rem;font-weight:800;text-align:center;outline:none;margin-bottom:16px;color:#1e293b;}
.start-btn{width:100%;background:#e11d48;color:white;border:none;border-radius:1rem;padding:16px;font-size:1.1rem;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.start-btn:active{background:#be123c;}

/* 結果卡 */
.result-card{background:white;border-radius:2rem;padding:40px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.15);text-align:center;margin-top:-50px;}
.result-card .trophy{font-size:3.5rem;margin-bottom:16px;}
.result-card h2{font-size:1.6rem;font-weight:900;color:#1e293b;margin-bottom:8px;}
.result-card p{font-size:1rem;color:#475569;margin-bottom:24px;line-height:1.8;}
.result-card p b.green{color:#22c55e;}
.result-card p b.red{color:#ef4444;}
.result-card p b.blue{color:#4f46e5;}
.btn-review{display:block;width:100%;background:#ef4444;color:white;border:none;border-radius:1rem;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-bottom:10px;}
.btn-home{display:block;width:100%;background:#e2e8f0;color:#334155;border:none;border-radius:1rem;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;}

/* 進度 */
.progress-wrap{margin-bottom:14px;}
.progress-row{display:flex;justify-content:space-between;color:white;font-size:0.75rem;font-weight:700;margin-bottom:6px;}
.progress-track{height:7px;background:rgba(255,255,255,0.25);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:white;border-radius:99px;transition:width 0.4s;}

/* 卡片 */
.card-wrap{perspective:1400px;height:500px;margin-bottom:18px;}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 0.55s cubic-bezier(0.23,1,0.32,1);}
.card.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2rem;background:white;box-shadow:0 20px 50px rgba(0,0,0,0.18);overflow:hidden;}
.card-back{transform:rotateY(180deg);background:#fafafa;}
.corner-tag{position:absolute;top:20px;left:24px;font-size:0.85rem;color:#e11d48;font-weight:800;background:rgba(225,29,72,0.1);padding:5px 14px;border-radius:10px;z-index:2;}
.back-corner-tag{position:absolute;top:20px;left:24px;font-size:0.85rem;color:#6366f1;font-weight:800;background:rgba(99,102,241,0.1);padding:5px 14px;border-radius:10px;z-index:2;}
.face-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 28px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.face-inner::-webkit-scrollbar{display:none;}

/* 題目文字 */
.q-text{font-size:1.15rem;font-weight:700;color:#1e293b;margin-bottom:6px;line-height:1.7;text-align:center;}

/* 選項 */
.opts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:12px;}
.opt-btn{font-size:1.05rem;font-weight:600;color:#475569;background:#f8fafc;padding:12px 20px;border-radius:1rem;border:2px solid #e2e8f0;cursor:pointer;text-align:left;position:relative;-webkit-tap-highlight-color:transparent;transition:all 0.15s;}
.opt-btn.selected{background:#fff1f2;border-color:#e11d48;color:#9f1239;}
.opt-btn.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#166534!important;}
.opt-btn.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#991b1b!important;}

/* 手寫格 */
.write-grids{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
.write-cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
.write-canvas{width:150px;height:150px;border:3px solid #fda4af;border-radius:14px;background:#fff5f5;touch-action:none;}
.write-canvas.active{border-color:#e11d48;}
.write-label{font-size:0.9rem;color:#9f1239;font-weight:700;}
.clear-btn{font-size:0.7rem;color:#e11d48;background:none;border:1px solid #fda4af;border-radius:8px;padding:3px 10px;cursor:pointer;}

/* 答案框 */
.answer-box{background:#fff1f2;border:2px solid #e11d48;border-radius:1rem;padding:14px 20px;width:100%;text-align:center;font-size:1.5rem;font-weight:900;color:#9f1239;margin-top:14px;letter-spacing:0.3em;display:none;}
.self-judge{display:none;justify-content:center;gap:12px;margin-top:14px;}
.btn-correct{background:#dcfce7;border:2px solid #22c55e;color:#166534;border-radius:1rem;padding:12px 24px;font-size:1.1rem;font-weight:800;cursor:pointer;}
.btn-wrong{background:#fee2e2;border:2px solid #ef4444;color:#991b1b;border-radius:1rem;padding:12px 24px;font-size:1.1rem;font-weight:800;cursor:pointer;}

/* 解析 */
.explanation{background:#f1f5f9;padding:20px;border-radius:1.2rem;width:100%;font-size:1.05rem;color:#475569;line-height:1.8;border-left:6px solid #e11d48;white-space:pre-wrap;overflow-y:auto;max-height:360px;-webkit-overflow-scrolling:touch;margin-top:8px;}
.back-title{font-size:0.75rem;font-weight:700;color:#e11d48;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;}

/* 底部按鈕 */
.action-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-bottom:20px;}
.action-btn{background:white;border-radius:1.2rem;padding:14px 10px;box-shadow:0 8px 20px rgba(0,0,0,0.1);min-width:70px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;cursor:pointer;font-size:0.65rem;font-weight:700;color:#64748b;-webkit-tap-highlight-color:transparent;}
.action-btn:disabled{opacity:0.4;cursor:not-allowed;}
.action-btn .icon{font-size:1.3rem;}
.btn-check-style{background:#10b981;color:white;}
.btn-flip-style{background:#6366f1;color:white;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="hero">
  <h1>國語 學習卡</h1>
</div>
<div class="page">

  <!-- 設定畫面 -->
  <div id="setupSection" class="setup-card">
    <div class="setup-icon">✍️</div>
    <div class="setup-title">設定測驗範圍</div>
    <div class="setup-sub">題庫共有 <b>109</b> 題</div>
    <label class="input-label">欲測驗題目數量</label>
    <input type="number" id="countInput" class="count-input" value="10" min="1" max="109">
    <button class="start-btn" id="startBtn">開始測驗</button>
  </div>

  <!-- 結果畫面 -->
  <div id="resultSection" class="result-card hidden">
    <div class="trophy">🏆</div>
    <h2>測驗完成！</h2>
    <p id="scoreText"></p>
    <button id="reviewBtn" class="btn-review hidden">重測錯題</button>
    <button class="btn-home" id="homeBtn">返回首頁</button>
  </div>

  <!-- 測驗畫面 -->
  <div id="studySection" class="hidden">
    <div class="progress-wrap">
      <div class="progress-row">
        <span id="modeText">Normal Mode</span>
        <span id="progressText">0 / 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar" style="width:0%"></div>
      </div>
    </div>

    <div class="card-wrap">
      <div class="card" id="card">
        <div class="card-face">
          <div class="corner-tag" id="frontTag"></div>
          <div class="face-inner">
            <div id="frontMain"></div>
            <div class="opts" id="optsArea"></div>
            <div class="write-grids" id="writeGrids"></div>
            <div class="answer-box" id="answerBox"></div>
            <div class="self-judge" id="selfJudge">
              <button class="btn-correct" id="correctBtn">✓ 我答對了</button>
              <button class="btn-wrong" id="wrongBtn">✗ 我答錯了</button>
            </div>
          </div>
        </div>
        <div class="card-face card-back">
          <div class="back-corner-tag">答案</div>
          <div class="face-inner">
            <div class="back-title">詳細解析</div>
            <div class="explanation" id="explanation"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button class="action-btn" id="prevBtn">
        <span class="icon">◀</span>PREV
      </button>
      <button class="action-btn btn-check-style" id="checkBtn">
        <span class="icon">📢</span>公布答案
      </button>
      <button class="action-btn btn-flip-style" id="flipBtn" disabled>
        <span class="icon">📖</span>FLIP詳解
      </button>
      <button class="action-btn" id="nextBtn">
        <span class="icon">▶</span>NEXT
      </button>
    </div>
  </div>
</div>

let currentDeck=[], wrongDeck=[], currentIndex=0;
let selectedIdx=null, isAnswered=false, isReview=false;
const card=document.getElementById('card');

function startQuiz(){
  let n=parseInt(document.getElementById('countInput').value)||10;
  n=Math.min(n,DECK.length);
  currentDeck=DECK.slice().sort(()=>Math.random()-0.5).slice(0,n);
  isReview=false; currentIndex=0; wrongDeck=[];
  document.getElementById('setupSection').classList.add('hidden');
  document.getElementById('studySection').classList.remove('hidden');
  showCard();
}

function startReview(){
  isReview=true; currentDeck=wrongDeck.slice(); currentIndex=0; wrongDeck=[];
  document.getElementById('resultSection').classList.add('hidden');
  document.getElementById('studySection').classList.remove('hidden');
  showCard();
}

function showCard(){
  isAnswered=false; selectedIdx=null;
  card.classList.remove('flipped');
  document.getElementById('flipBtn').disabled=true;
  document.getElementById('checkBtn').disabled=false;
  document.getElementById('answerBox').style.display='none';
  document.getElementById('selfJudge').style.display='none';
  document.getElementById('writeGrids').innerHTML='';
  document.getElementById('optsArea').innerHTML='';

  const d=currentDeck[currentIndex];
  document.getElementById('frontTag').textContent=d.unit+'｜'+d.type;

  const fm=document.getElementById('frontMain');
  fm.innerHTML=d.display.split('\n').map(l=>'<p class="q-text">'+l+'</p>').join('');

  if(d.type==='選擇題'){
    const oa=document.getElementById('optsArea');
    d.options.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt-btn';
      b.textContent=o;
      b.onclick=(()=>{ const idx=i+1; return ()=>selectOpt(idx,b); })();
      oa.appendChild(b);
    });
    card.dataset.qtype='choice';
  } else {
    buildGrids(d.char_count||1);
    card.dataset.qtype='write';
  }

  let exp='正確答案：'+d.answer;
  if(d.explanation) exp+='\n\n解析：'+d.explanation;
  document.getElementById('explanation').textContent=exp;

  const pct=((currentIndex+1)/currentDeck.length*100).toFixed(0);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressText').textContent=(currentIndex+1)+' / '+currentDeck.length;
  document.getElementById('modeText').textContent=isReview?'Review Mode':'Normal Mode';
}

function buildGrids(n){
  const area=document.getElementById('writeGrids');
  for(let i=0;i<n;i++){
    const cell=document.createElement('div'); cell.className='write-cell';
    const canvas=document.createElement('canvas'); canvas.className='write-canvas';
    canvas.width=300; canvas.height=300;
    setupDraw(canvas);
    const lbl=document.createElement('div'); lbl.className='write-label'; lbl.textContent='第'+(i+1)+'格';
    const clr=document.createElement('button'); clr.className='clear-btn'; clr.textContent='清除';
    clr.onclick=()=>clearCanvas(canvas);
    cell.appendChild(canvas); cell.appendChild(lbl); cell.appendChild(clr);
    area.appendChild(cell);
  }
}

function setupDraw(c){
  const ctx=c.getContext('2d');
  function grid(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.save(); ctx.strokeStyle='#fecdd3'; ctx.lineWidth=1.5;
    ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.moveTo(c.width/2,0); ctx.lineTo(c.width/2,c.height);
    ctx.moveTo(0,c.height/2); ctx.lineTo(c.width,c.height/2);
    ctx.stroke(); ctx.restore();
  }
  grid(); c._grid=grid;
  let drawing=false, lx=0, ly=0;
  function pos(e){
    const r=c.getBoundingClientRect(), sx=c.width/r.width, sy=c.height/r.height;
    if(e.touches) return{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};
    return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
  }
  function start(e){ e.preventDefault(); drawing=true; c.classList.add('active');
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=10; ctx.lineCap='round'; ctx.lineJoin='round';
    const p=pos(e); lx=p.x; ly=p.y;
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fillStyle='#1e293b'; ctx.fill(); }
  function move(e){ if(!drawing)return; e.preventDefault();
    const p=pos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; }
  function stop(){ drawing=false; c.classList.remove('active'); }
  c.addEventListener('mousedown',start); c.addEventListener('mousemove',move);
  c.addEventListener('mouseup',stop); c.addEventListener('mouseleave',stop);
  c.addEventListener('touchstart',start,{passive:false});
  c.addEventListener('touchmove',move,{passive:false});
  c.addEventListener('touchend',stop);
}

function clearCanvas(c){ const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); if(c._grid)c._grid(); }

function selectOpt(idx,el){
  if(isAnswered)return;
  selectedIdx=idx;
  document.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
}

function checkAnswer(){
  if(isAnswered)return;
  isAnswered=true;
  const d=currentDeck[currentIndex];
  if(card.dataset.qtype==='choice'){
    if(selectedIdx===null){isAnswered=false;alert('請先選擇一個選項！');return;}
    const ci=parseInt(d.answer);
    const btns=document.querySelectorAll('.opt-btn');
    btns[ci-1].classList.add('correct');
    if(selectedIdx!==ci){ btns[selectedIdx-1].classList.add('wrong'); if(!wrongDeck.includes(d))wrongDeck.push(d); }
  } else {
    const ab=document.getElementById('answerBox');
    ab.textContent='正確答案：'+d.answer;
    ab.style.display='block';
    document.getElementById('selfJudge').style.display='flex';
  }
  document.getElementById('checkBtn').disabled=true;
  document.getElementById('flipBtn').disabled=false;
}

function selfJudge(ok){
  document.getElementById('selfJudge').style.display='none';
  if(!ok){ const d=currentDeck[currentIndex]; if(!wrongDeck.includes(d))wrongDeck.push(d); }
}

function flipCard(){ if(isAnswered)card.classList.toggle('flipped'); }

function nextCard(){
  if(currentIndex<currentDeck.length-1){ currentIndex++; showCard(); }
  else showResults();
}

function prevCard(){ if(currentIndex>0){ currentIndex--; showCard(); } }

function showResults(){
  document.getElementById('studySection').classList.add('hidden');
  document.getElementById('resultSection').classList.remove('hidden');
  const t=currentDeck.length, w=wrongDeck.length;
  document.getElementById('scoreText').innerHTML=
    '本次測驗：<b class="blue">'+t+' 題</b><br>答對：<b class="green">'+(t-w)+'</b>　答錯：<b class="red">'+w+'</b>';
  const rb=document.getElementById('reviewBtn');
  if(w>0)rb.classList.remove('hidden'); else rb.classList.add('hidden');
}
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('startBtn').addEventListener('click', startQuiz);
  document.getElementById('checkBtn').addEventListener('click', checkAnswer);
  document.getElementById('flipBtn').addEventListener('click', flipCard);
  document.getElementById('prevBtn').addEventListener('click', prevCard);
  document.getElementById('nextBtn').addEventListener('click', nextCard);
  document.getElementById('correctBtn').addEventListener('click', function(){ selfJudge(true); });
  document.getElementById('wrongBtn').addEventListener('click', function(){ selfJudge(false); });
  document.getElementById('reviewBtn').addEventListener('click', startReview);
  document.getElementById('homeBtn').addEventListener('click', function(){ location.reload(); });
});
