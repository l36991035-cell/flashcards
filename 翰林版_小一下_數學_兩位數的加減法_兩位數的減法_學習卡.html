        </div>

    </div>

</div>

  ["應用題","填填看","一盒馬卡龍有 56 顆，姐姐生日帶一盒馬卡龍請同學們吃，同學們共吃了 44 顆，還剩下幾顆馬卡龍？\n算式：56－44＝（　　）","","","","","12","56－44＝12（顆）\n個位 6－4＝2，十位 5－4＝1，還剩下 12 顆馬卡龍。"],
  ["應用題","填填看","小露有 21 朵玫瑰花，送給老師 6 朵，還有幾朵玫瑰花？\n算式：21－6＝（　　）","","","","","15","21－6＝15（朵）\n個位 1 不夠減 6，向十位借 1，變成 11－6＝5，十位 2－1＝1，還有 15 朵玫瑰花。"],
  ["應用題","填填看","手工冰淇淋店老闆今天做了草莓口味 48 枝、水蜜桃口味 35 枝、哈密瓜口味 22 枝。\n草莓口味和哈密瓜口味的冰淇淋相差多少枝？\n算式：48－22＝（　　）","","","","","26","48－22＝26（枝）\n個位 8－2＝6，十位 4－2＝2，相差 26 枝。"]
];

let currentDeck=[], wrongDeck=[], currentIndex=0;
let selectedIdx=null, isAnswered=false, isReview=false;
const card=document.getElementById('card');

function startQuiz(){
  var n=parseInt(document.getElementById('countInput').value)||10;
  n=Math.min(n,DECK.length);
  var tmp=DECK.slice(); tmp.sort(function(){return Math.random()-0.5;});
  currentDeck=tmp.slice(0,n);
  wrongDeck=[]; currentIndex=0; isReview=false;
  document.getElementById('setupSection').classList.add('hidden');
  document.getElementById('resultSection').classList.add('hidden');
  document.getElementById('studySection').classList.remove('hidden');
  showCard();
}

function startReview(){
  currentDeck=wrongDeck.slice(); wrongDeck=[];
  currentIndex=0; isReview=true;
  document.getElementById('resultSection').classList.add('hidden');
  document.getElementById('studySection').classList.remove('hidden');
  document.getElementById('modeText').textContent='錯題重測';
  showCard();
}

function renderContent(el, text){
  el.innerHTML='';
  var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line) continue;
    if(line.startsWith('data:image')){
      var img=document.createElement('img');
      img.src=line;
      img.className='q-img';
      el.appendChild(img);
    } else {
      var p=document.createElement('p');
      p.className='q-text';
      p.textContent=line;
      el.appendChild(p);
    }
  }
}

function showCard(){
  selectedIdx=null; isAnswered=false;
  card.classList.remove('flipped');
  document.getElementById('flipBtn').disabled=true;
  document.getElementById('checkBtn').disabled=false;
  document.getElementById('answerBox').style.display='none';
  document.getElementById('selfJudge').style.display='none';

  var d=currentDeck[currentIndex];
  var type=d[1];
  document.getElementById('frontTag').textContent=type;

  var fm=document.getElementById('frontMain');
  renderContent(fm, d[2]);

  var oa=document.getElementById('optsArea');
  oa.innerHTML='';
  var hasOpts=(d[1]==='選擇題');
  if(hasOpts){
    for(var j=3;j<=6;j++){
      if(!d[j]) continue;
      var btn=document.createElement('button');
      btn.className='opt-btn';
      btn.textContent=''+['','①','②','③','④'][j-2]+'  '+d[j];
      (function(idx,b){ b.addEventListener('click',function(){ selectOpt(idx,b); }); })(j-2,btn);
      oa.appendChild(btn);
    }
  }

  var pct=((currentIndex+1)/currentDeck.length*100).toFixed(0);
  document.getElementById('progressText').textContent=(currentIndex+1)+' / '+currentDeck.length;
  document.getElementById('progressBar').style.width=pct+'%';

  // 詳解背面
  var expEl=document.getElementById('explanation');
  var expText=(d[1]==='選擇題' ? (d[8]||d[7]) : d[7]);
  renderContent(expEl, expText||'');
}

function selectOpt(idx,el){
  if(isAnswered) return;
  selectedIdx=idx;
  var btns=document.querySelectorAll('.opt-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('selected');
  el.classList.add('selected');
}

function checkAnswer(){
  if(isAnswered) return;
  isAnswered=true;
  document.getElementById('flipBtn').disabled=false;
  document.getElementById('checkBtn').disabled=true;
  var d=currentDeck[currentIndex];

  if(d[1]==='選擇題'){
    var ci=parseInt(d[7]);
    var btns=document.querySelectorAll('.opt-btn');
    for(var i=0;i<btns.length;i++){
      var optIdx=i+1;
      if(optIdx===ci) btns[i].classList.add('correct');
      else if(optIdx===selectedIdx) btns[i].classList.add('wrong');
    }
    if(selectedIdx!==ci){
      if(wrongDeck.indexOf(d)===-1) wrongDeck.push(d);
    }
  } else {
    var ab=document.getElementById('answerBox');
    ab.style.display='block';
    ab.innerHTML='';
    var alines=d[7].split('\n');
    for(var ai=0;ai<alines.length;ai++){
      var al=alines[ai].trim();
      if(!al) continue;
      if(al.startsWith('data:image')){
        var aimg=document.createElement('img');
        aimg.src=al; aimg.className='q-img';
        ab.appendChild(aimg);
      } else {
        var aspan=document.createElement('div');
        aspan.textContent=al;
        ab.appendChild(aspan);
      }
    }
    document.getElementById('selfJudge').style.display='flex';
  }
}

function selfJudgeCorrect(){ document.getElementById('selfJudge').style.display='none'; }
function selfJudgeWrong(){
  document.getElementById('selfJudge').style.display='none';
  var d=currentDeck[currentIndex];
  if(wrongDeck.indexOf(d)===-1) wrongDeck.push(d);
}

function flipCard(){ if(isAnswered) card.classList.toggle('flipped'); }

function nextCard(){
  if(currentIndex<currentDeck.length-1){ currentIndex++; showCard(); }
  else showResults();
}

function prevCard(){ if(currentIndex>0){ currentIndex--; showCard(); } }

function showResults(){
  document.getElementById('studySection').classList.add('hidden');
  document.getElementById('resultSection').classList.remove('hidden');
  var t=currentDeck.length, w=wrongDeck.length, c=t-w;
  document.getElementById('scoreText').textContent='答對 '+c+' 題，答錯 '+w+' 題，共 '+t+' 題。';
  var rb=document.getElementById('reviewBtn');
  if(w>0){ rb.classList.remove('hidden'); rb.textContent='重測錯題（'+w+'題）'; }
  else rb.classList.add('hidden');
  var title=document.getElementById('resultTitle');
  var pct=Math.round(c/t*100);
  title.textContent=pct>=90?'太棒了！':pct>=70?'不錯喔！':'繼續加油！';
}

document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('startBtn').addEventListener('click',startQuiz);
  document.getElementById('checkBtn').addEventListener('click',checkAnswer);
  document.getElementById('flipBtn').addEventListener('click',flipCard);
  document.getElementById('prevBtn').addEventListener('click',prevCard);
  document.getElementById('nextBtn').addEventListener('click',nextCard);
  document.getElementById('correctBtn').addEventListener('click',selfJudgeCorrect);
  document.getElementById('wrongBtn').addEventListener('click',selfJudgeWrong);
  document.getElementById('reviewBtn').addEventListener('click',startReview);
  document.getElementById('homeBtn').addEventListener('click',function(){ location.reload(); });
});
</script>
</body>
</html>
