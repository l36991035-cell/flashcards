<script>

  ["選擇題","選擇題","在運用虹吸現象為水箱換水時，哪一個操作步驟是正確的？","將水管兩邊都放入水箱","水管內要充滿空氣","水管的出水口要比水族箱的水面低","水管須是黑色且不能彎折","3","答案：③ 水管出水口必須低於水族箱水面，水才會順利流出。"],
  ["選擇題","選擇題","下列哪一項敘述所指的是「毛細現象」？","水由高處往低處流的現象","水可經由縫隙移動到各處的現象","將某些物體加入水中攪拌後會消失的現象","水會被荷葉上的細毛彈開的現象","2","答案：② 毛細現象是指水可以經由縫隙移動到各處的現象。"],
  ["選擇題","選擇題","老師在進行虹吸現象的實驗前，將水染色的目的是什麼？","淨化水中的雜質","水面才會出現變化","降低水流動的速度","清楚觀察水的流動","4","答案：④ 染色是為了讓水的流動更清晰可見，方便觀察。"],
  ["選擇題","選擇題","根據連通管原理，將水加入U形的軟水管中，當水靜止時，水管兩邊的水面高度會呈現什麼情形？","左邊比右邊高","左邊比右邊低","兩邊一樣高","有時是左邊比較高，有時是右邊比較高","3","答案：③ 根據連通管原理，水靜止時兩邊高度一樣高。"],
  ["選擇題","選擇題","「在兩個底部相連的容器內加水後，當水靜止時，兩個容器的水面高度會相同。」上述現象與何者有關？","浮力作用","水無法被壓縮","連通管原理","物質能被水溶解","3","答案：③ 這正是連通管原理的定義。"],
  ["選擇題","選擇題","「油漆沿刷子縫隙移動、用吸管喝果汁、用毛筆沾墨汁、瀑布的水由高處往低處流」以上共有幾個例子和毛細現象有關？","1個","2個","3個","4個","2","答案：② 油漆沿刷子縫隙移動、用毛筆沾墨汁是毛細現象；吸管喝果汁靠氣壓，瀑布靠重力，共2個。"],
  ["選擇題","選擇題","「用充滿水的水管連接兩個容器，當水管的出水口低於入水口容器的水面，水會沿著彎曲水管上升再流向出水口，這個現象稱為★。」★應填入什麼？","浮力作用","虹吸現象","溶解現象","反射現象","2","答案：② 這正是虹吸現象的定義。"],

  ["選擇題","選擇題","小芳使用軟水管為水箱換水時，如何調整出水口高度，才能讓水順利流出箱外？","比水族箱的水面高","和水族箱的水面一樣高","比水族箱的水面低","出水口的高度與此無關","3","答案：③ 出水口必須低於水族箱水面，水才會因虹吸現象流出。"],
  ["選擇題","選擇題","小管把水倒入U形透明水管後讓水管左高右低，一段時間後水管兩邊的水面高度會如何？","兩邊高度一樣","右邊比左邊低","右邊比左邊高","左邊的水面會忽高忽低","1","答案：① 根據連通管原理，最終兩邊水面高度一樣。"],

  ["選擇題","選擇題","將裝了水的水管彎成U形後，下列與管內水面變化有關的敘述，何者有誤？","兩邊水管的水面高度相同","左邊水管向下移，水面也會往下降","不管兩邊如何移動，水面都會維持水平","若一邊持續往下移，在低於某個高度後水會流出","2","答案：② 左邊水管向下移，水面不會往下降，連通管原理使兩端水面保持一樣高。"],

  ["選擇題","選擇題","小強水管裡充滿空氣，阿文水管充滿水，哪一個人的水流動比較順暢？","小強","阿文","速度一樣","都不會流動","2","答案：② 虹吸現象需要水管充滿水才能順暢進行，充滿空氣無法形成虹吸。"],
  ["選擇題","選擇題","下列對於連通管原理的敘述，哪一項錯誤？","水管兩側的水面永遠保持水平","可以用來測量物品是否水平","一般稱為虹吸現象","應用到生活中可以讓生活更便利","3","答案：③ 連通管原理不等於虹吸現象，兩者是不同的概念。"],
  ["選擇題","選擇題","下列哪一種情形中，液體不是從高處往低處流？","毛筆沾墨水","打開水龍頭","瀑布","下雨","1","答案：① 毛筆沾墨水是毛細現象，水向上移動，不是從高處往低處流。"],

  ["選擇題","選擇題","用兩片玻璃片進行毛細現象時，如何提高水上升的高度？","縮小玻璃片間的縫隙","加大玻璃片間的縫隙","將水的顏色染更深","將容器換大一點的","1","答案：① 縫隙越小，毛細現象越明顯，水上升越高。"],

  ["選擇題","選擇題","阿信在兩片玻璃片夾入大頭針，水位變成左高右低，請問大頭針夾在哪個位置？","靠左邊","靠右邊","正中間","無法確定","2","答案：② 大頭針靠右邊，使右側縫隙較大，毛細現象較弱，水位較低。"],
  ["選擇題","選擇題","將水倒入粗細形狀不同但底部相通的容器中，當水靜止時，各容器水面高度會如何？","高度相同","容器開口愈粗水面高度愈高","容器高度愈高水面高度愈高","容器口徑愈小水面高度愈高","1","答案：① 根據連通管原理，底部相通的容器水靜止時高度均相同。"],

  ["選擇題","選擇題","在「觀察水在物體中的移動情形」實驗中，水會在下列哪一項物品中向上或向左右移動？","餐巾紙","鋁箔紙","塑膠袋","水都不會在這些物品中移動","1","答案：① 餐巾紙有微小縫隙，可以產生毛細現象；鋁箔紙和塑膠袋沒有縫隙。"],
  ["選擇題","選擇題","洗手臺底部的水管做成彎曲狀的目的是什麼？","提高售價","方便排水","隔絕臭味","降低流速","3","答案：③ 彎曲水管積水形成水封，可以隔絕臭味從排水管進入室內。"],
  ["選擇題","選擇題","曉諭幫水族箱換水，水流出後將出水口拉高到水面以上，會發生什麼情形？","水繼續流出，直到水族箱的水流完","水不再流出，反向流回水族箱中","水斷斷續續的流出，但仍會流完","水管內的水仍然靜止不動","2","答案：② 出水口高於水面時，虹吸中斷，水反向流回水族箱。"],
  ["選擇題","選擇題","洗手臺下方為什麼要使用彎曲狀的排水管？","純粹為了美觀","設計上的錯誤","使水管彎曲處積水隔絕臭味","防止洗手臺摔破","3","答案：③ 彎曲排水管積水形成水封，隔絕排水管中的臭味進入室內。"],
  ["選擇題","選擇題","可以利用什麼物品將桌面上的水擦乾？","塑膠袋","抹布","鋁箔紙","保鮮膜","2","答案：② 抹布有許多小縫隙，可以透過毛細現象吸乾桌面的水。"],
  ["選擇題","選擇題","利用「連通管原理」可以做什麼事情？","寫毛筆字","擦拭溼的桌子","測量物品是否垂直地面","測量物體兩側是否水平","4","答案：④ 連通管原理可用來測量物體兩側是否水平。"],
  ["選擇題","選擇題","上文中畫線的部分，哪一項和毛細現象有關？（用布拖把將地上的水吸乾）","ㄅ","ㄆ","ㄇ","ㄈ","2","答案：② 用布拖把將地上的水吸乾，是毛細現象的應用。"],
  ["選擇題","選擇題","下列哪一個是虹吸現象的應用？","用抹布擦拭桌面的飲料","茶壺水面的高度","用充滿水的水管將水族箱換水","利用吸管喝飲料","3","答案：③ 用充滿水的水管換水，出水口低於水面，即為虹吸現象。"],
  ["選擇題","選擇題","「小咪跌倒撞倒玻璃杯…小可則趕緊用布拖把將地上的水吸乾。」框起來的部分有幾項和毛細現象有關？","1項","2項","3項","4項","1","答案：① 用布拖把將地上的水吸乾是毛細現象，共1項。"],
  ["選擇題","選擇題","光光拿了一條軟水管幫水族箱換水時，水管中需要充滿什麼東西？","空氣","泥沙","水","水泥","3","答案：③ 虹吸現象需要水管充滿水才能發揮作用。"],
  ["選擇題","選擇題","湘怡收集了下列關於水運用在生活中的例子，哪一項與連通管原理的應用無關？","利用浮板游泳","利用裝水的軟水管測量物體水平","洗手臺底部的彎曲水管裡有積水，可隔絕臭味","茶壺壺口的高度不能太低","1","答案：① 利用浮板游泳是浮力的應用，與連通管原理無關。"],
  ["選擇題","選擇題","下列哪一項物品的設計應用了連通管原理？","酒精燈","廚房紙巾","反光背心","熱水瓶","4","答案：④ 熱水瓶的透明窗應用連通管原理，透明窗和內膽水面高度相同。"],
  ["選擇題","選擇題","機車維修廠使用充滿機油的軟水管幫機油箱換油，怎麼做可以讓機油完全流完？","在軟水管上戳幾個小洞","將機油箱內的油加熱","提高軟水管出水口的高度","讓軟水管出水口的高度低於機油箱底","4","答案：④ 出水口低於機油箱底部，虹吸現象才能讓機油全部流出。"],
  ["選擇題","選擇題","林家兩兄弟利用一條透明水管裝一些水，幫媽媽測量掛的油畫是不是水平，他們利用哪種原理？","虹吸現象","連通管原理","毛細現象","電池並聯","2","答案：② 利用裝水透明水管兩端水面等高，測量水平，應用連通管原理。"],
  ["選擇題","選擇題","阿力不小心將果汁打翻，發現果汁滲入桌子和桌墊之間，這是什麼現象造成的？","毛細現象","浮力作用","蒸發","凝結","1","答案：① 液體透過桌子和桌墊之間的微小縫隙移動，這是毛細現象。"],

  ["選擇題","選擇題","小迅不小心將U形水管ㄅ端壓在鉛筆上，ㄅ端水面到桌面距離是10公分，ㄆ端水面到桌面距離是多少？","比10公分多","比10公分少","10公分","0公分","3","答案：③ 根據連通管原理，兩端水面到地面（同一水平面）的距離相同，都是10公分。"],
  ["選擇題","選擇題","洗手臺底部的彎曲水管裡為什麼要保留一些水？","降低流速","順利排水","外形美觀","隔絕臭味","4","答案：④ 彎曲水管積水形成水封，隔絕排水管中的臭味。"],

  ["選擇題","選擇題","小花想用虹吸現象幫水族箱換水，水管內已充滿水但水卻流不出來，應該如何改變出水口？","讓水管的出水口和水族箱的水面一樣高","讓水管的出水口比水族箱的水面高","讓水管的出水口比水族箱的水面低","先把水管裡的水放掉","3","答案：③ 出水口必須低於水族箱水面，水才會流出。"],
  ["選擇題","選擇題","水族店員運用虹吸現象幫大型水族箱換水時，應注意哪些地方？","兩個水族箱的距離至少相隔10公尺","水管的出水口比水族箱的水面高","水管內不用充滿水","水管的出水口比水族箱的水面低","4","答案：④ 出水口低於水面，且水管充滿水，才能順利換水。"],
  ["選擇題","選擇題","下列哪一項屬於連通管原理的應用？","油漆沿著油漆刷縫隙移動","洗手臺底部的彎曲水管裡有積水","毛巾吸水","蠟油沿著燭芯上升","2","答案：② 洗手臺彎曲水管積水是連通管原理的應用，其餘為毛細現象。"],
  ["選擇題","選擇題","下列哪一項不是毛細現象的應用？","用報紙吸水","利用吸管吸果汁","用衛生紙擦桌上的水","毛筆沾取墨水","2","答案：② 用吸管喝飲料是利用氣壓（負壓），不是毛細現象。"],
  ["選擇題","選擇題","小溫在兩片玻璃片之間，分別夾上1張、3張與5張小紙片後放入水杯中，哪一組的水上升得最高？","夾1張紙的","夾3張紙的","夾5張紙的","一樣高","1","答案：① 夾入紙片越少，縫隙越小，毛細現象越強，水上升越高，1張縫隙最小。"],

var activeFilters=[];var CATS=[];
(function(){var seen={};for(var i=0;i<DECK.length;i++){var c=DECK[i][0];if(!seen[c]){seen[c]=1;CATS.push(c);}}})();
function getFilteredDeck(){if(activeFilters.length===0)return DECK.slice();return DECK.filter(function(d){return activeFilters.indexOf(d[0])>=0;});}
function updateSetup(){var fd=getFilteredDeck();document.getElementById('totalCount').textContent=fd.length;document.getElementById('countInput').max=fd.length;if(parseInt(document.getElementById('countInput').value)>fd.length)document.getElementById('countInput').value=fd.length;}

function renderContent(el,text){
  el.innerHTML='';
  var lines=text.split(/\\n|\n/),i=0;
  while(i<lines.length){
    var ln=lines[i].trim();
    if(!ln){i++;continue;}
    if(ln.startsWith('data:image')){
      var row=document.createElement('div');row.className='coin-row';
      while(i<lines.length&&lines[i].trim().startsWith('data:image')){
        (function(src){var img=document.createElement('img');img.src=src;img.className='coin-img';
          img.onload=function(){if(this.naturalWidth>100){this.className='scene-img';this.parentNode.style.display='block';}};
          row.appendChild(img);})(lines[i].trim());i++;
      }
      el.appendChild(row);
    }else{var p=document.createElement('p');p.className='q-text';p.textContent=ln;el.appendChild(p);i++;}
  }
}


let currentDeck=[], wrongDeck=[], currentIndex=0;
let selectedIdx=null, isAnswered=false, isReview=false;
var card;

function startQuiz(){
  var fd=getFilteredDeck();
  var n=parseInt(document.getElementById('countInput').value)||10;
  n=Math.min(n,fd.length);
  var tmp=fd.slice(); tmp.sort(function(){return Math.random()-0.5;});
  currentDeck=tmp.slice(0,n);
  wrongDeck=[]; currentIndex=0; isReview=false;
  document.getElementById('setupSection').classList.add('hidden');
  document.getElementById('resultSection').classList.add('hidden');
  document.getElementById('studySection').classList.remove('hidden');
  showCard();
}

function startReview(){
  currentDeck=wrongDeck.slice(); wrongDeck=[];
  currentIndex=0; isReview=true;
  document.getElementById('resultSection').classList.add('hidden');
  document.getElementById('studySection').classList.remove('hidden');
  document.getElementById('modeText').textContent='錯題重測';
  showCard();
}

function renderContent(el, text){
  el.innerHTML='';
  var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line) continue;
    if(line.startsWith('data:image')){
      var img=document.createElement('img');
      img.src=line;
      img.className='q-img';
      el.appendChild(img);
    } else {
      var p=document.createElement('p');
      p.className='q-text';
      p.textContent=line;
      el.appendChild(p);
    }
  }
}

function showCard(){
  selectedIdx=null; isAnswered=false;
  card.classList.remove('flipped');
  document.getElementById('flipBtn').disabled=true;
  document.getElementById('checkBtn').disabled=false;
  document.getElementById('answerBox').style.display='none';
  document.getElementById('selfJudge').style.display='none';

  var d=currentDeck[currentIndex];
  var type=d[1];
  document.getElementById('frontTag').textContent=type;

  var fm=document.getElementById('frontMain');
  renderContent(fm, d[2]);

  var oa=document.getElementById('optsArea');
  oa.innerHTML='';
  var hasOpts=(d[1]==='選擇題');
  if(hasOpts){
    for(var j=3;j<=6;j++){
      if(!d[j]) continue;
      var btn=document.createElement('button');
      btn.className='opt-btn';
      btn.textContent=''+['①','②','③','④'][j-3]+'  '+d[j];
      (function(idx,b){ b.addEventListener('click',function(){ selectOpt(idx,b); }); })(j-2,btn);
      oa.appendChild(btn);
    }
  }

  var pct=((currentIndex+1)/currentDeck.length*100).toFixed(0);
  document.getElementById('progressText').textContent=(currentIndex+1)+' / '+currentDeck.length;
  document.getElementById('progressBar').style.width=pct+'%';

  // 詳解背面
  var expEl=document.getElementById('explanation');
  var expText=(d[1]==='選擇題' ? (d[8]||d[7]) : d[7]);
  renderContent(expEl, expText||'');
}

function selectOpt(idx,el){
  if(isAnswered) return;
  selectedIdx=idx;
  var btns=document.querySelectorAll('.opt-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('selected');
  el.classList.add('selected');
}

function checkAnswer(){
  if(isAnswered) return;
  isAnswered=true;
  document.getElementById('flipBtn').disabled=false;
  document.getElementById('checkBtn').disabled=true;
  var d=currentDeck[currentIndex];

  if(d[1]==='選擇題'){
    var ci=parseInt(d[7]);
    var btns=document.querySelectorAll('.opt-btn');
    for(var i=0;i<btns.length;i++){
      var optIdx=i+1;
      if(optIdx===ci) btns[i].classList.add('correct');
      else if(optIdx===selectedIdx) btns[i].classList.add('wrong');
    }
    if(selectedIdx!==ci){
      if(wrongDeck.indexOf(d)===-1) wrongDeck.push(d);
    }
  } else {
    var ab=document.getElementById('answerBox');
    ab.style.display='block';
    ab.innerHTML='';
    var alines=d[7].split('\n');
    for(var ai=0;ai<alines.length;ai++){
      var al=alines[ai].trim();
      if(!al) continue;
      if(al.startsWith('data:image')){
        var aimg=document.createElement('img');
        aimg.src=al; aimg.className='q-img';
        ab.appendChild(aimg);
      } else {
        var aspan=document.createElement('div');
        aspan.textContent=al;
        ab.appendChild(aspan);
      }
    }
    document.getElementById('selfJudge').style.display='flex';
  }
}

function selfJudgeCorrect(){ document.getElementById('selfJudge').style.display='none'; }
function selfJudgeWrong(){
  document.getElementById('selfJudge').style.display='none';
  var d=currentDeck[currentIndex];
  if(wrongDeck.indexOf(d)===-1) wrongDeck.push(d);
}

function flipCard(){ if(isAnswered) card.classList.toggle('flipped'); }

function nextCard(){
  if(currentIndex<currentDeck.length-1){ currentIndex++; showCard(); }
  else showResults();
}

function prevCard(){ if(currentIndex>0){ currentIndex--; showCard(); } }

function showResults(){
  document.getElementById('studySection').classList.add('hidden');
  document.getElementById('resultSection').classList.remove('hidden');
  var t=currentDeck.length, w=wrongDeck.length, c=t-w;
  document.getElementById('scoreText').textContent='答對 '+c+' 題，答錯 '+w+' 題，共 '+t+' 題。';
  var rb=document.getElementById('reviewBtn');
  if(w>0){ rb.classList.remove('hidden'); rb.textContent='重測錯題（'+w+'題）'; }
  else rb.classList.add('hidden');
  var title=document.getElementById('resultTitle');
  var pct=Math.round(c/t*100);
  title.textContent=pct>=90?'太棒了！':pct>=70?'不錯喔！':'繼續加油！';
}

document.addEventListener('DOMContentLoaded',function(){
  card=document.getElementById('card');
  var fr=document.getElementById('filterRow');
  CATS.forEach(function(cat){
    var btn=document.createElement('button');
    btn.className='filter-btn';btn.textContent=cat;
    btn.addEventListener('click',function(){
      this.classList.toggle('active');
      if(this.classList.contains('active')){
        if(activeFilters.indexOf(cat)<0)activeFilters.push(cat);
      }else{
        activeFilters=activeFilters.filter(function(c){return c!==cat;});
      }
      updateSetup();
    });
    fr.appendChild(btn);
  });
  updateSetup();
  document.getElementById('startBtn').addEventListener('click',startQuiz);
  document.getElementById('checkBtn').addEventListener('click',checkAnswer);
  document.getElementById('flipBtn').addEventListener('click',flipCard);
  document.getElementById('prevBtn').addEventListener('click',prevCard);
  document.getElementById('nextBtn').addEventListener('click',nextCard);
  document.getElementById('correctBtn').addEventListener('click',selfJudgeCorrect);
  document.getElementById('wrongBtn').addEventListener('click',selfJudgeWrong);
  document.getElementById('reviewBtn').addEventListener('click',startReview);
  document.getElementById('homeBtn').addEventListener('click',function(){ location.reload(); });
});


</script>
</html>
