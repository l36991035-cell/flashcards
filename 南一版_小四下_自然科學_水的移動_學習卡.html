<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>水的移動 學習卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#f1f5f9;min-height:100vh;-webkit-user-select:none;user-select:none;}
.page{max-width:700px;margin:0 auto;padding:16px 16px 60px;}
.hero{border-radius:0 0 3rem 3rem;margin:-16px -16px 0;padding:28px 20px 80px;text-align:center;background:linear-gradient(135deg,#06b6d4,#0284c7);}
.hero h1{color:white;font-size:1.7rem;font-weight:900;margin-bottom:4px;}
.hero p{color:rgba(255,255,255,0.8);font-size:0.9rem;}
.setup-card{background:white;border-radius:2rem;padding:36px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.15);text-align:center;margin-top:-50px;}
.setup-icon{width:64px;height:64px;border-radius:1.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.6rem;background:#ecfeff;}
.setup-title{font-size:1.4rem;font-weight:900;color:#1e293b;margin-bottom:6px;}
.setup-sub{color:#64748b;font-size:0.9rem;margin-bottom:24px;}
.setup-sub b{font-weight:800;}
.input-label{font-size:0.7rem;font-weight:700;color:#94a3b8;letter-spacing:0.1em;text-transform:uppercase;display:block;margin-bottom:8px;}
.count-input{width:100%;background:#f1f5f9;border:none;border-radius:1rem;padding:14px;font-size:1.3rem;font-weight:800;text-align:center;outline:none;margin-bottom:16px;color:#1e293b;}
.start-btn{width:100%;background:linear-gradient(135deg,#06b6d4,#0284c7);color:white;border:none;border-radius:1rem;padding:16px;font-size:1.1rem;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.start-btn:active{opacity:0.85;}
.result-card{background:white;border-radius:2rem;padding:40px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.15);text-align:center;margin-top:-50px;}
.result-card .trophy{font-size:3.5rem;margin-bottom:16px;}
.result-card h2{font-size:1.6rem;font-weight:900;color:#1e293b;margin-bottom:8px;}
.result-card p{font-size:1rem;color:#475569;margin-bottom:24px;line-height:1.8;}
.btn-review{display:block;width:100%;background:#ef4444;color:white;border:none;border-radius:1rem;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-bottom:10px;}
.btn-home{display:block;width:100%;background:#e2e8f0;color:#334155;border:none;border-radius:1rem;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;}
.progress-wrap{margin-bottom:14px;}
.progress-row{display:flex;justify-content:space-between;color:white;font-size:0.75rem;font-weight:700;margin-bottom:6px;}
.progress-track{height:7px;background:rgba(255,255,255,0.25);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:white;border-radius:99px;transition:width 0.4s;}
.card-wrap{perspective:1400px;height:520px;margin-bottom:18px;}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 0.55s cubic-bezier(0.23,1,0.32,1);}
.card.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2rem;background:white;box-shadow:0 20px 50px rgba(0,0,0,0.18);overflow:hidden;}
.card-back{transform:rotateY(180deg);background:#fafafa;}
.corner-tag{position:absolute;top:20px;left:24px;font-size:0.85rem;font-weight:800;background:rgba(6,182,212,0.1);color:#0284c7;padding:5px 14px;border-radius:10px;z-index:2;}
.back-corner-tag{position:absolute;top:20px;left:24px;font-size:0.85rem;color:#6366f1;font-weight:800;background:rgba(99,102,241,0.1);padding:5px 14px;border-radius:10px;z-index:2;}
.face-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.face-inner::-webkit-scrollbar{display:none;}
.q-text{font-size:1.05rem;font-weight:700;color:#1e293b;margin-bottom:6px;line-height:1.7;text-align:center;white-space:pre-wrap;}
.opts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:12px;}
.opt-btn{font-size:1rem;font-weight:600;color:#475569;background:#f8fafc;padding:12px 20px;border-radius:1rem;border:2px solid #e2e8f0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;transition:all 0.15s;}
.opt-btn.selected{background:#ecfeff;border-color:#06b6d4;color:#0284c7;}
.opt-btn.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#166534!important;}
.opt-btn.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#991b1b!important;}
.answer-box{border:2px solid #06b6d4;border-radius:1rem;padding:14px 20px;width:100%;text-align:center;font-size:1.1rem;font-weight:900;color:#0284c7;background:#ecfeff;margin-top:14px;display:none;white-space:pre-wrap;line-height:1.8;text-align:left;}
.self-judge{display:none;justify-content:center;gap:12px;margin-top:14px;}
.btn-correct{background:#dcfce7;border:2px solid #22c55e;color:#166534;border-radius:1rem;padding:12px 24px;font-size:1.1rem;font-weight:800;cursor:pointer;}
.btn-wrong-j{background:#fee2e2;border:2px solid #ef4444;color:#991b1b;border-radius:1rem;padding:12px 24px;font-size:1.1rem;font-weight:800;cursor:pointer;}
.explanation{background:#f1f5f9;padding:20px;border-radius:1.2rem;width:100%;font-size:1.05rem;color:#475569;line-height:1.8;border-left:6px solid #06b6d4;white-space:pre-wrap;overflow-y:auto;max-height:380px;-webkit-overflow-scrolling:touch;margin-top:8px;}
.back-title{font-size:0.75rem;font-weight:700;color:#0284c7;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;}
.action-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-bottom:20px;}
.action-btn{background:white;border-radius:1.2rem;padding:14px 10px;box-shadow:0 8px 20px rgba(0,0,0,0.1);min-width:70px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;cursor:pointer;font-size:0.65rem;font-weight:700;color:#64748b;-webkit-tap-highlight-color:transparent;}
.action-btn:disabled{opacity:0.4;cursor:not-allowed;}
.action-btn .icon{font-size:1.3rem;}
.btn-check-style{background:#10b981;color:white;}
.btn-flip-style{background:#6366f1;color:white;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="hero">
  <h1>💧 水的移動 學習卡</h1>
  <p>南一版・小四下・自然科學</p>
</div>
<div class="page">
  <div id="setupSection" class="setup-card">
    <div class="setup-icon">🔬</div>
    <div class="setup-title">設定測驗範圍</div>
    <div class="setup-sub">題庫共有 <b>84</b> 題</div>
    <label class="input-label">欲測驗題目數量</label>
    <input type="number" id="countInput" class="count-input" value="10" min="1" max="84">
    <button class="start-btn" id="startBtn">開始測驗</button>
  </div>
  <div id="resultSection" class="result-card hidden">
    <div class="trophy">🏆</div>
    <h2 id="resultTitle">測驗結束！</h2>
    <p id="scoreText"></p>
    <button id="reviewBtn" class="btn-review hidden">重測錯題</button>
    <button id="homeBtn" class="btn-home">返回首頁</button>
  </div>
  <div id="studySection" class="hidden">
    <div class="progress-wrap">
      <div class="progress-row">
        <span id="modeText">一般模式</span>
        <span id="progressText">0 / 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar" style="width:0%"></div>
      </div>
    </div>
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="card-face">
          <div class="corner-tag" id="frontTag"></div>
          <div class="face-inner">
            <div id="frontMain"></div>
            <div class="opts" id="optsArea"></div>
            <div class="answer-box" id="answerBox"></div>
            <div class="self-judge" id="selfJudge">
              <button class="btn-correct" id="correctBtn">✓ 我答對了</button>
              <button class="btn-wrong-j" id="wrongBtn">✗ 我答錯了</button>
            </div>
          </div>
        </div>
        <div class="card-face card-back">
          <div class="back-corner-tag">詳解</div>
          <div class="face-inner">
            <div class="back-title">解題過程</div>
            <div class="explanation" id="explanation"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="action-row">
      <button class="action-btn" id="prevBtn"><span class="icon">◀</span>PREV</button>
      <button class="action-btn btn-check-style" id="checkBtn"><span class="icon">📢</span>公布答案</button>
      <button class="action-btn btn-flip-style" id="flipBtn" disabled><span class="icon">📖</span>FLIP詳解</button>
      <button class="action-btn" id="nextBtn"><span class="icon">▶</span>NEXT</button>
    </div>
  </div>
</div>
<script>
const DECK=[
  ["毛細現象","選擇題","艾莉絲不小心把報紙的一小角浸到爸爸寫書法用的墨汁裡，一段時間後，整張報紙會有什麼變化？","消失不見","變成黑色的","熱熱的","燒起來","2","墨汁透過報紙的細小縫隙移動（毛細現象），使整張報紙都變黑。"],
  ["毛細現象","選擇題","瀅瀅將下列物品剪成一樣的形狀，並同時將物品放入水中，請問水不會在哪一種物品中移動？","衛生紙","餐巾紙","鋁箔紙","報紙","3","鋁箔紙沒有細小縫隙，水無法藉由毛細現象移動。衛生紙、餐巾紙、報紙都有縫隙，水會移動。"],
  ["毛細現象","選擇題","小妮不小心把衛生紙的一小角泡到裝冷水的杯子裡，一段時間後，整張衛生紙會有什麼變化？","完全消失不見","熱熱的","溼溼的","變色","3","水透過衛生紙的細小縫隙移動（毛細現象），使整張衛生紙都變溼。"],
  ["毛細現象","選擇題","下列哪一項是毛細現象的應用？","用水管把水往上噴","從湖面看見自己的倒影","下完雨後烏雲變少","利用毛巾擦汗","4","用毛巾擦汗時，汗水因毛細現象移動到毛巾細小縫隙中，達到吸水效果。"],
  ["毛細現象","選擇題","阿廣觀察了許多與水有關的現象，下列哪一項是毛細現象的應用？","用勺子把桶子裡的水舀出來","精油沿著擴香棒縫隙移動","糖加入水中消失不見","河流的水由上游往下游流","2","精油沿著擴香棒縫隙移動，就是毛細現象的應用。"],
  ["毛細現象","選擇題","下列哪一個情況可以觀察到毛細現象？","利用抹布擦翻倒的水","瀑布由上往下流","用吸管喝飲料","噴水池的水往上噴","1","抹布有許多細小縫隙，翻倒的水會沿縫隙進入抹布，這就是毛細現象。"],
  ["毛細現象","選擇題","毛巾、餐巾紙和衛生紙常被用來擦拭被水弄溼的地方，是因為它們有什麼共同特徵？","都是塑膠製品","都是長方形","物品內具有縫隙，且縫隙很小","重量都很輕","3","毛巾、餐巾紙、衛生紙內部都有許多細小縫隙，水藉由毛細現象進入縫隙，達到吸水效果。"],
  ["毛細現象","選擇題","自然現象中，水不僅會從高處往低處流，還能藉由物品的縫隙四處移動，下列哪一項是毛細現象的應用？","食鹽加入水中消失不見","利用抹布將打翻的水擦乾","冰塊變成一攤水","利用吸管吸果汁","2","抹布利用毛細現象將水吸入縫隙中，所以可以擦乾打翻的水。"],
  ["毛細現象","選擇題","南南將甲、乙、丙三組，分別用兩片玻璃片夾入不同厚度的紙片，使縫隙大小分別為1毫米、2毫米、3毫米，將一端放入紅墨水中後，紅墨水在哪一組玻璃片內上升最明顯？","甲組（縫隙1毫米）","乙組（縫隙2毫米）","丙組（縫隙3毫米）","結果都相同","1","毛細現象規律：縫隙愈小，液體上升愈高。甲組縫隙最小（1毫米），水上升最明顯。"],
  ["毛細現象","選擇題","有關水流動方向的敘述，下列哪一項的水移動方向與其他不同？","溪流","瀑布","天空下雨","毛筆沾墨","4","①②③都是水向下流；④毛筆沾墨是毛細現象，水沿縫隙向上移動，方向不同。"],
  ["毛細現象","選擇題","用兩片玻璃片進行毛細現象時，如何提高水上升的高度？","縮小玻璃片間的縫隙","加大玻璃片間的縫隙","將水的顏色染更深","將容器換大一點的","1","縫隙愈小，毛細現象愈明顯，水上升的高度愈高。"],
  ["毛細現象","選擇題","將下列物品裁剪成大小相同的長條形，並同時將一端放入水中；水在哪一種物品中移動的情形最明顯？","衛生紙","塑膠袋","鋁箔紙","膠帶","1","衛生紙內有許多細小縫隙，毛細現象最明顯。塑膠袋、鋁箔紙、膠帶都沒有縫隙，水不會移動。"],
  ["毛細現象","選擇題","祐祐想測試下列物品的吸水力，將它們剪成大小相同的長條狀，並同時將一端放入水中；請問哪一種物品的吸水力最差？","圖畫紙","衛生紙","手帕","塑膠片","4","塑膠片沒有微小縫隙，無法產生毛細現象，所以吸水力最差。"],
  ["毛細現象","選擇題","將下列物品的一端接觸水，水不會在哪一項物品中向上或向左右移動？","餐巾紙","鐵尺","抹布","海綿","2","鐵尺是金屬，沒有讓水可以移動的縫隙，所以水不會在鐵尺中移動。"],
  ["毛細現象","選擇題","下列哪一項不是毛細現象的應用？","用報紙吸水","利用吸管吸果汁","用衛生紙擦桌上的水","毛筆沾取墨水","2","用吸管喝果汁是靠口腔負壓（吸力），不是毛細現象。其餘①③④都是毛細現象的應用。"],
  ["毛細現象","選擇題","阿力不小心將果汁打翻了，發現果汁滲入桌子和桌墊之間，這是什麼現象造成的？","毛細現象","浮力作用","蒸發","凝結","1","桌子和桌墊之間有細小縫隙，果汁藉由毛細現象滲入縫隙中。\n①毛細現象：水在微小縫隙中移動的現象。\n②浮力：物體放進水裡受到向上的力。\n③蒸發：水變成水蒸氣。\n④凝結：水蒸氣遇冷變成小水滴。"],
  ["毛細現象","選擇題","下列小朋友所說的敘述，哪一項所指的是「毛細現象」？","敦敦：「將某些物體加入水中攪拌後會消失的現象。」","小依：「游泳圈浮在水面上。」","小蕙：「冰塊會融化成水。」","小蔡：「水可經由縫隙移動到各處的現象。」","4","毛細現象的定義：水（液體）可以藉由物品中的微小縫隙移動到各處的現象。"],
  ["毛細現象","選擇題","「油漆沿刷子縫隙移動、用吸管喝果汁、用毛筆沾墨汁、瀑布的水由高處往低處流」，以上共有幾個例子和毛細現象有關？","1個","2個","3個","4個","2","油漆沿刷子縫隙移動 ✓、用毛筆沾墨汁 ✓，共2個是毛細現象。\n用吸管喝果汁靠負壓，瀑布靠重力，都不是毛細現象。"],
  ["毛細現象","選擇題","水可以在縫隙中移動的現象稱為「毛細現象」，下列哪一項不是這種現象的應用？","利用毛巾擦汗","用拖把將地面積水擦乾","油漆沿著油漆刷縫隙移動","用吸管喝紅茶","4","用吸管喝紅茶是靠嘴巴吸氣產生負壓，不是毛細現象。①②③都是毛細現象的應用。"],
  ["毛細現象","選擇題","進行毛細現象的實驗時，要將水染成什麼顏色？","藍色","紅色","綠色","染成什麼顏色都可以","4","染色的目的是讓水的流動更容易被觀察，顏色本身不影響毛細現象，任何顏色都可以。"],
  ["毛細現象","選擇題","老師在進行虹吸現象的實驗前，將水染色的目的是什麼？","淨化水中的雜質","水面才會出現變化","降低水流動的速度","清楚觀察水的流動","4","將水染色是為了讓水的流動路徑清晰可見，方便觀察和記錄，不影響水流速度。"],
  ["毛細現象","選擇題","柚柚將兩片玻璃片靠在一起後直接固定，倩倩將兩根大頭針放入兩片玻璃片中間後再固定，同時將玻璃片的一端放入紅墨水中，哪一個人的玻璃片水上升得比較高？","一樣高","倩倩","柚柚","不一定","3","柚柚的玻璃片直接靠在一起，縫隙較小；倩倩夾了大頭針，縫隙較大。縫隙愈小，水上升愈高，所以柚柚的水上升較高。"],
  ["毛細現象","選擇題","小溫在兩片玻璃片之間，分別夾上1張、3張與5張小紙片後放入水杯中，如果紙片沒有碰到水，哪一組的水上升得最高？","夾1張紙的","夾3張紙的","夾5張紙的","一樣高","1","夾的紙片愈少，玻璃片間縫隙愈小，毛細現象愈強，水上升愈高。夾1張縫隙最小，上升最高。"],
  ["毛細現象","選擇題","為什麼可以利用抹布擦乾打翻的飲料？","因為抹布具有磁性","因為抹布很便宜","因為抹布內有很多小縫隙","因為抹布內有油","3","抹布內有許多細小縫隙，飲料藉由毛細現象移動到抹布縫隙中，達到吸水效果。"],
  ["毛細現象","選擇題","在「觀察水在物體中的移動情形」實驗中，水會在下列哪一項物品中向上或向左右移動？","餐巾紙","鋁箔紙","塑膠袋","水都不會在這些物品中移動","1","餐巾紙有細小縫隙，水可以藉由毛細現象移動；鋁箔紙和塑膠袋沒有縫隙，水不會移動。"],
  ["毛細現象","選擇題","可以利用什麼物品將桌面上的水擦乾？","塑膠袋","抹布","鋁箔紙","保鮮膜","2","抹布有許多細小縫隙，可藉由毛細現象吸水，所以可以擦乾桌面的水。塑膠袋、鋁箔紙、保鮮膜都沒有縫隙。"],
  ["毛細現象","選擇題","下列哪一種情形中，液體不是從高處往低處流？","毛筆沾墨水","打開水龍頭","瀑布","下雨","1","毛筆沾墨水是毛細現象，液體沿縫隙向上移動；②③④都是液體從高處往低處流。"],
  ["連通管","選擇題","日常生活中觀察到的現象或例子中，何者與連通管原理無關？","透過熱水瓶的透明窗能得知水量","洗手臺底部的彎曲水管","茶壺的壺口太低無法裝太多水","能在空氣中聞到擴香瓶內的精油香味","4","①②③都是連通管原理的應用；④能聞到精油香味是氣體擴散現象，與連通管原理無關。"],
  ["連通管","選擇題","根據連通管原理的定義，將水加入U形的軟水管中，當水靜止時，水管兩邊的水面高度會呈現什麼情形？","左邊比右邊高","左邊比右邊低","兩邊一樣高","有時左邊比較高，有時右邊比較高","3","連通管原理：底部相通的容器，當水靜止時，兩側水面高度一定相同。"],
  ["連通管","選擇題","小管把水倒入U形的透明水管後，讓水管形成左高右低的形狀，一段時間後，水管兩邊的水面高度會如何？","兩邊高度一樣","右邊比左邊低","右邊比左邊高","左邊的水面會忽高忽低","1","不管水管如何彎曲或傾斜，根據連通管原理，水靜止時兩端水面高度一定相同。"],
  ["連通管","選擇題","「在兩個底部相連的容器內加水後，當水靜止時，兩個容器的水面高度會相同。」上述現象與何者有關？","浮力作用","水無法被壓縮","連通管原理","物質能被水溶解","3","這正是連通管原理的定義：底部相通的容器，水靜止時水面高度相同。"],
  ["連通管","選擇題","「熱水瓶外殼的透明窗顯示的水面高度與內膽相同。」上句應用到的原理與下列哪一個現象相同？","茶壺的壺口太低無法裝太多水","毛筆沾完墨汁後能寫出黑色的字","油漆會沿著油漆刷的縫隙移動","軟水管內充滿水後能幫水族箱換水","1","熱水瓶透明窗和壺嘴都是連通管原理：底部相連，水面高度相同。②③是毛細現象，④是虹吸現象。"],
  ["連通管","選擇題","透過熱水瓶外側的透明窗可以得知瓶內的水量，這個例子與下列何者有關？","連通管原理","反射現象","直進現象","溶解現象","1","熱水瓶的透明窗與內膽底部相通，根據連通管原理，兩側水面高度相同，因此可從透明窗得知瓶內水量。"],
  ["連通管","選擇題","下列各種生活中的應用，哪一個運用到連通管原理？","用毛筆沾取墨水寫書法","利用裝水的透明軟水管比對圖是否掛歪","用抹布擦桌子","吹風機吹乾溼頭髮","2","透明軟水管裝水後彎成U形，根據連通管原理，兩端水面高度相同，可用來測量水平。①是毛細現象，③④無關。"],
  ["連通管","選擇題","阿辰將裝水的容器傾斜後靜置，再測量容器右方水面的高度為6公分，請問容器左方水面的高度為幾公分？","8公分","6公分","7公分","5公分","2","根據連通管原理，水靜止後同一容器左右兩側的水面高度相同，因此左方也是6公分。"],
  ["連通管","選擇題","有關連通管原理的敘述，下列哪一項錯誤？","可以用來測量物體的水平","容器中的水靜止時，水面高度一樣","在日常生活中有許多應用的例子","又稱為虹吸現象","4","連通管原理是指底部相通的容器水面等高；虹吸現象是利用充滿水的彎管讓水逆重力流動，兩者不同。"],

  ["連通管","選擇題","湘怡收集了下列關於水運用在生活中的例子，哪一項與連通管原理的應用無關？","利用浮板游泳","利用裝水的軟水管測量物體水平","洗手臺底部的彎曲水管裡有積水，可隔絕臭味","茶壺壺口的高度不能太低","1","利用浮板游泳是浮力的應用；②③④都是連通管原理的應用。"],

  ["連通管","選擇題","下列對於連通管原理的敘述，哪一項錯誤？","水管兩側的水面永遠保持水平","可以用來測量物品是否水平","一般稱為虹吸現象","應用到生活中可以讓生活更便利","3","連通管原理不等於虹吸現象，這是兩種不同的原理。連通管是靜態等高，虹吸是動態流動。"],
  ["連通管","選擇題","充滿水的水管連接甲水瓶（距地面60公分）和乙水瓶（距地面30公分），在水面靜止的情況下，哪一瓶的水量較多？","水不斷在兩個水管內流動","甲瓶","乙瓶","一樣多","3","根據連通管原理，水靜止時兩端水面「絕對高度」相同。甲瓶在60公分高，乙瓶在30公分高，水面絕對高度相同時，乙瓶的水面距瓶底較高，乙瓶水量較多。"],
  ["連通管","選擇題","小迅將水族箱放在桌上時，不小心將ㄅ端壓在鉛筆上。如果ㄅ端水面到桌面的距離是10公分，那麼ㄆ端水面到桌面的距離是多少？","比10公分多","比10公分少","10公分","0公分","3","根據連通管原理，水靜止時同一容器兩端水面高度（距桌面距離）相同，都是10公分。"],
  ["連通管","選擇題","小賴將水倒入形狀不同但底部相通，且水平放置在桌上的容器中並測量水面高度，下列哪一項可能是小賴的測量結果？","4公分、5公分、6公分","7公分、7公分、7公分","8公分、8公分、9公分","3公分、0公分、7公分","2","連通管原理：底部相通且水平擺放的容器，水靜止時各容器水面高度一定相同。只有②全部相同。"],

  ["連通管","選擇題","洗手臺底部的水管做成彎曲狀的目的是什麼？","提高售價","方便排水","隔絕臭味","降低流速","3","彎曲的水管中積水可以隔絕下水道的臭味，防止臭氣飄進室內。"],
  ["連通管","選擇題","洗手臺下方為什麼要使用彎曲狀的排水管？","純粹為了美觀","設計上的錯誤","使水管彎曲處積水隔絕臭味","防止洗手臺摔破","3","彎曲水管中保留的積水，利用連通管原理形成水封，隔絕下水道臭氣。"],
  ["連通管","選擇題","洗手臺底部的彎曲水管裡總是留著一些水，以隔開臭味，這個例子運用了什麼現象或原理？","蒸發現象","反射現象","連通管原理","毛細現象","3","彎曲水管的積水形成水封，運用的是連通管原理，使臭氣無法穿過積水飄進室內。"],
  ["連通管","選擇題","為了隔絕水管中的臭味，洗手臺的水管會呈現什麼樣的形式？","直線","彎曲形","不規則","Y字型","2","洗手臺的排水管做成彎曲形，利用積水形成水封隔絕臭味。"],

  ["連通管","選擇題","利用「連通管原理」可以做什麼事情？","寫毛筆字","擦拭溼的桌子","測量物品是否垂直地面","測量物體兩側是否水平","4","連通管原理的特性是底部相通的容器水面等高，可用來測量物體兩側是否水平。"],
  ["連通管","選擇題","將水倒入粗細和形狀都不同但底部相通的容器中，當水靜止時，各個容器裡的水面高度會如何？","高度相同","容器開口愈粗水面高度愈高","容器高度愈高水面高度愈高","容器口徑愈小水面高度愈高","1","連通管原理：不管容器形狀、粗細如何，底部相通且靜止時，水面高度一定相同。"],
  ["虹吸現象","選擇題","「用充滿水的水管連接兩個容器，當水管的出水口低於放置入水口容器的水面，入水口的水會沿著彎曲的水管上升再流向出水口，這個現象稱為★。」上句中的★應填入什麼？","浮力作用","虹吸現象","溶解現象","反射現象","2","這就是虹吸現象的定義：充滿液體的彎管，當出水口低於水面時，液體會逆重力上升再往下流。"],
  ["虹吸現象","選擇題","在運用虹吸現象為水箱換水時，哪一個操作步驟是正確的？","將水管兩邊都放入水箱","水管內要充滿空氣","水管的出水口要比水族箱的水面低","水管須是黑色且不能彎折","3","虹吸換水：水管要充滿「水」（不是空氣），且出水口要低於水族箱水面，水才會流出。"],
  ["虹吸現象","選擇題","小芳使用軟水管為水箱換水時，除了確保水管內要充滿水外，還須如何調整軟水管的出水口高度，才能讓水順利的流出箱外？","比水族箱的水面高","和水族箱的水面一樣高","比水族箱的水面低","出水口的高度與此無關","3","虹吸現象要能成功，出水口必須低於入水口的水面，水才會持續向外流。"],
  ["虹吸現象","選擇題","如果想要利用虹吸現象幫機車更換機油，已知機油油箱的底部距離地面30公分，當軟水管的出水口離地面幾公分時可以使油箱內的機油全部流出來？","20公分","30公分","40公分","50公分","1","要讓機油「全部」流出，出水口高度必須低於機油箱底部（30公分），只有20公分符合條件。"],
  ["虹吸現象","選擇題","盈盈想要更換機車的機油，已知機油箱的底部距離地面40公分，當軟水管的出水口離地面幾公分時可以使機油箱內的油全部流出來？","25公分","50公分","75公分","100公分","1","要讓油全部流出，出水口必須低於機油箱底部（40公分），只有25公分符合。"],
  ["虹吸現象","選擇題","秀秀、遙遙和小如利用相同的水管同時幫水族箱換水，出水口距地面分別為10公分、50公分、100公分，哪個人水管內的水會流得比較快？","秀秀（10公分）","遙遙（50公分）","小如（100公分）","一樣快","1","出水口位置愈低，水位落差愈大，水流速愈快。秀秀出水口最低（10公分），水流最快。"],
  ["虹吸現象","選擇題","運用虹吸現象換水的敘述，哪一項是正確的？","水管中要充滿水，才能順利完成換水的工作","水管的出水口高度不會影響水流的方向","水管的出水口與水族箱的水面等高，水才會流出","水管的出水口高於水族箱的水面，水才會流出","1","虹吸換水需要：水管充滿水＋出水口低於水族箱水面。\n解析：水管要充滿水才能產生虹吸效果，且出水口要低於水面水才會流出。"],
  ["虹吸現象","選擇題","小強和阿文分別用水管進行虹吸現象的實驗，小強的水管裡充滿空氣，阿文的水管則充滿水，請問哪一個人的水流動的比較順暢？","小強","阿文","速度一樣","都不會流動","2","虹吸現象必須水管內充滿水才能產生。充滿空氣的水管無法產生虹吸效果，阿文的水流動較順暢。"],
  ["虹吸現象","選擇題","京京家裡的水族箱髒了，已知水族箱的水面距離地面60公分，當軟水管的出水口離地面幾公分時水族箱內的水會全部流出來？","70公分","65公分","60公分","55公分","4","要讓水族箱的水全部流出，出水口必須低於水族箱水面（60公分），55公分低於60公分，水才會持續流出直到流完。"],
  ["虹吸現象","選擇題","光光拿了一條軟水管幫水族箱換水時，水管中需要充滿什麼東西？","空氣","泥沙","水","水泥","3","虹吸換水時，水管中必須充滿水，不能有空氣，才能產生虹吸效果讓水順利流出。"],
  ["虹吸現象","選擇題","機車維修廠的店員使用充滿機油的軟水管幫機油箱換油時，怎麼做可以讓機油箱內的油完全流完？","在軟水管上戳幾個小洞","將機油箱內的油加熱","提高軟水管出水口的高度","讓軟水管出水口的高度低於機油箱底","4","要讓油全部流完，出水口必須低於機油箱底部（最低點），才能利用虹吸現象將最後的油都抽出。"],
  ["虹吸現象","選擇題","想要利用軟水管幫水族箱換水時，哪一種方法可以使軟水管內充滿水，而且最方便衛生？","將軟水管一端插入水族箱中，用嘴由另一端吹氣","將軟水管一端插入水族箱中，用嘴由另一端吸氣","將整個軟水管放入水中","將水族箱內的水倒入軟水管中","3","將整個軟水管放入水中取出，水管內充滿水，既方便又衛生。\n①吹氣無法讓水管充滿水；②用嘴吸氣不衛生；④容易把水倒出來。"],
  ["虹吸現象","選擇題","小花想用虹吸現象幫水族箱換水，水管內已經充滿水了，但是水卻流不出來，請問小花應該把水管的出水口做怎樣的改變？","讓水管的出水口和水族箱的水面一樣高","讓水管的出水口比水族箱的水面高","讓水管的出水口比水族箱的水面低","先把水管裡的水放掉","3","水管已充滿水，流不出來表示出水口不夠低。應讓出水口低於水族箱水面，水就會流出。"],
  ["虹吸現象","選擇題","利用裝滿水的水管幫水族箱換水時，可以控制水流的方向，請問該如何做到？","減少水管的長度","增加水管的長度","調整水管的管徑大小","調整出水口位置的高低","4","調整出水口位置的高低可以控制水流方向：\n出水口低於水面→水流出；高於水面→水停止或回流。"],

var card,currentDeck,currentIndex,selectedIdx,isAnswered,wrongDeck;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startQuiz(){
  var n=parseInt(document.getElementById("countInput").value)||10;
  n=Math.min(n,DECK.length);
  var pool=shuffle(DECK.slice()).slice(0,n);
  currentDeck=pool; currentIndex=0; wrongDeck=[]; isAnswered=false; selectedIdx=null;
  document.getElementById("setupSection").classList.add("hidden");
  document.getElementById("resultSection").classList.add("hidden");
  document.getElementById("studySection").classList.remove("hidden");
  document.getElementById("modeText").textContent="一般模式";
  showCard();
}
function startReview(){
  currentDeck=shuffle(wrongDeck.slice()); currentIndex=0; wrongDeck=[]; isAnswered=false; selectedIdx=null;
  document.getElementById("resultSection").classList.add("hidden");
  document.getElementById("studySection").classList.remove("hidden");
  document.getElementById("modeText").textContent="錯題重測";
  showCard();
}
function renderContent(el,text){
  el.innerHTML="";
  var lines=text.split("\n"),i=0;
  while(i<lines.length){
    var ln=lines[i].trim();
    if(!ln){i++;continue;}
    if(ln.startsWith("data:image")){
      var row=document.createElement("div");
      row.className="coin-row";
      while(i<lines.length&&lines[i].trim().startsWith("data:image")){
        (function(src){
          var img=document.createElement("img");
          img.src=src;img.className="q-img";
          row.appendChild(img);
        })(lines[i].trim());
        i++;
      }
      el.appendChild(row);
    } else {
      var p=document.createElement("p");
      p.className="q-text";p.textContent=ln;
      el.appendChild(p);
      i++;
    }
  }
}
function showCard(){
  selectedIdx=null;isAnswered=false;
  card.classList.remove("flipped");
  document.getElementById("flipBtn").disabled=true;
  document.getElementById("checkBtn").disabled=false;
  document.getElementById("answerBox").style.display="none";
  document.getElementById("selfJudge").style.display="none";
  var d=currentDeck[currentIndex];
  document.getElementById("frontTag").textContent=d[0];
  var fm=document.getElementById("frontMain");
  renderContent(fm,d[2]);
  var oa=document.getElementById("optsArea");
  oa.innerHTML="";
  if(d[1]==="選擇題"){
    for(var j=3;j<=6;j++){
      if(!d[j]) continue;
      var btn=document.createElement("button");
      btn.className="opt-btn";
      btn.textContent=""+["","①","②","③","④"][j-2]+"  "+d[j];
      (function(idx,b){b.addEventListener("click",function(){selectOpt(idx,b);});})(j-2,btn);
      oa.appendChild(btn);
    }
  }
  var pct=((currentIndex+1)/currentDeck.length*100).toFixed(0);
  document.getElementById("progressText").textContent=(currentIndex+1)+" / "+currentDeck.length;
  document.getElementById("progressBar").style.width=pct+"%";
  var expEl=document.getElementById("explanation");
  var expText=(d[1]==="選擇題"?(d[8]||d[7]):d[7]);
  renderContent(expEl,expText||"");
}
function selectOpt(idx,el){
  if(isAnswered) return;
  selectedIdx=idx;
  var btns=document.querySelectorAll(".opt-btn");
  for(var i=0;i<btns.length;i++) btns[i].classList.remove("selected");
  el.classList.add("selected");
}
function checkAnswer(){
  if(isAnswered) return;
  isAnswered=true;
  document.getElementById("flipBtn").disabled=false;
  document.getElementById("checkBtn").disabled=true;
  var d=currentDeck[currentIndex];
  if(d[1]==="選擇題"){
    var ci=parseInt(d[7]);
    var btns=document.querySelectorAll(".opt-btn");
    for(var i=0;i<btns.length;i++){
      var optIdx=i+1;
      if(optIdx===ci) btns[i].classList.add("correct");
      else if(optIdx===selectedIdx) btns[i].classList.add("wrong");
    }
    if(selectedIdx!==ci){if(wrongDeck.indexOf(d)===-1) wrongDeck.push(d);}
  } else {
    var ab=document.getElementById("answerBox");
    ab.style.display="block";
    ab.innerHTML="";
    var alines=d[7].split("\n");
    for(var ai=0;ai<alines.length;ai++){
      var al=alines[ai].trim();if(!al) continue;
      var aspan=document.createElement("div");
      aspan.textContent=al;ab.appendChild(aspan);
    }
    document.getElementById("selfJudge").style.display="flex";
  }
}
function selfJudgeCorrect(){document.getElementById("selfJudge").style.display="none";}
function selfJudgeWrong(){
  document.getElementById("selfJudge").style.display="none";
  var d=currentDeck[currentIndex];
  if(wrongDeck.indexOf(d)===-1) wrongDeck.push(d);
}
function flipCard(){if(isAnswered) card.classList.toggle("flipped");}
function nextCard(){if(currentIndex<currentDeck.length-1){currentIndex++;showCard();}else showResults();}
function prevCard(){
  if(currentIndex>0){currentIndex--;showCard();}
}
function showResults(){
  document.getElementById("studySection").classList.add("hidden");
  document.getElementById("resultSection").classList.remove("hidden");
  var t=currentDeck.length,w=wrongDeck.length,c=t-w;
  document.getElementById("scoreText").textContent="答對 "+c+" 題，答錯 "+w+" 題，共 "+t+" 題。";
  var rb=document.getElementById("reviewBtn");
  if(w>0){rb.classList.remove("hidden");rb.textContent="重測錯題（"+w+"題）";}
  else rb.classList.add("hidden");
  var pct=Math.round(c/t*100);
  document.getElementById("resultTitle").textContent=pct>=90?"太棒了！":pct>=70?"不錯喔！":"繼續加油！";
}
document.addEventListener("DOMContentLoaded",function(){
  card=document.getElementById("card");
  document.getElementById("startBtn").addEventListener("click",startQuiz);
  document.getElementById("checkBtn").addEventListener("click",checkAnswer);
  document.getElementById("flipBtn").addEventListener("click",flipCard);
  document.getElementById("prevBtn").addEventListener("click",prevCard);
  document.getElementById("nextBtn").addEventListener("click",nextCard);
  document.getElementById("correctBtn").addEventListener("click",selfJudgeCorrect);
  document.getElementById("wrongBtn").addEventListener("click",selfJudgeWrong);
  document.getElementById("reviewBtn").addEventListener("click",startReview);
  document.getElementById("homeBtn").addEventListener("click",function(){location.reload();});
});
</script>
</body>
